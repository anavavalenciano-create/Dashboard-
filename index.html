/* ============================================================
   12g. SEATING CHART  (free-position desks + on-desk evidence)
============================================================ */
const SEAT_COLS=6;                 // only used for migrating the oldest grid-based charts
const ROOM_W=960;                  // fixed room width — identical on every device
const DESK_W=108,DESK_H=84;        // real desk footprint in px (matches the CSS box)
const GAP_X=22,GAP_Y=30;           // breathing room between desks
/* ---- free-position layout generators — all return {x,y,rot} in real pixels within a ROOM_W-wide room ---- */
function genRows(n){
  if(n<=0)return[];
  const pitchX=DESK_W+GAP_X,pitchY=DESK_H+GAP_Y;
  const perRow=Math.max(3,Math.min(7,Math.floor((ROOM_W-140)/pitchX)));
  const topMargin=76;
  const out=[];
  for(let i=0;i<n;i++){
    const r=Math.floor(i/perRow),c=i%perRow;
    const thisRowCount=Math.min(perRow,n-r*perRow);
    const startX=(ROOM_W-(thisRowCount-1)*pitchX)/2;
    out.push({x:startX+c*pitchX,y:topMargin+r*pitchY,rot:0});
  }
  return out;
}
function podOffsetsPx(size){
  const hw=DESK_W*0.58,hh=DESK_H*0.62;
  if(size<=2)return[[-hw,0],[hw,0]];
  if(size===3)return[[-hw,-hh],[hw,-hh],[0,hh]];
  if(size===4)return[[-hw,-hh],[hw,-hh],[-hw,hh],[hw,hh]];
  if(size===5)return[[-hw,-hh],[hw,-hh],[-hw,hh],[hw,hh],[0,0]];
  return[[-hw*1.35,-hh],[0,-hh],[hw*1.35,-hh],[-hw*1.35,hh],[0,hh],[hw*1.35,hh]];
}
function genGroups(n,groupSize){
  if(n<=0)return[];
  groupSize=Math.max(2,Math.min(6,groupSize||4));
  const groups=Math.ceil(n/groupSize);
  const podPitchX=DESK_W*1.85+40,podPitchY=DESK_H*1.9+46;
  const cols=Math.max(1,Math.min(5,Math.floor((ROOM_W-140)/podPitchX)));
  const topMargin=92;
  const out=[];let idx=0;
  for(let g=0;g<groups&&idx<n;g++){
    const gc=g%cols,gr=Math.floor(g/cols);
    const thisRowGroups=Math.min(cols,groups-gr*cols);
    const startX=(ROOM_W-(thisRowGroups-1)*podPitchX)/2;
    const cx=startX+gc*podPitchX,cy=topMargin+gr*podPitchY;
    const remaining=Math.min(groupSize,n-idx);
    const offs=podOffsetsPx(remaining);
    for(let k=0;k<remaining;k++,idx++)out.push({x:cx+offs[k][0],y:cy+offs[k][1],rot:0});
  }
  return out;
}
function genHorseshoe(n,insetPx,topPx){
  if(n<=0)return[];
  insetPx=insetPx??100;topPx=topPx??80;
  const pitchY=DESK_H+GAP_Y,pitchX=DESK_W+GAP_X;
  const maxBottom=Math.max(2,Math.floor((ROOM_W-2*insetPx)/pitchX)+1);
  const bottomCount=Math.min(n,maxBottom);
  const armTotal=n-bottomCount;
  const leftCount=Math.ceil(armTotal/2),rightCount=armTotal-leftCount;
  const armMax=Math.max(leftCount,rightCount,1);
  const bottomY=topPx+armMax*pitchY;
  const out=[];
  for(let i=0;i<leftCount;i++)out.push({x:insetPx,y:topPx+(i+1)*pitchY,rot:0});
  const bw=(bottomCount-1)*pitchX,bStartX=(ROOM_W-bw)/2;
  for(let i=0;i<bottomCount;i++)out.push({x:bStartX+i*pitchX,y:bottomY,rot:0});
  for(let i=0;i<rightCount;i++)out.push({x:ROOM_W-insetPx,y:topPx+(i+1)*pitchY,rot:0});
  return out;
}
function genDoubleHorseshoe(n){
  if(n<=0)return[];
  const outerN=Math.max(1,Math.round(n*0.6)),innerN=n-outerN;
  return[...genHorseshoe(outerN,90,74),...genHorseshoe(innerN,260,190)];
}
// migrate any older seating chart (grid col/row, or the previous %-based version) to real pixels
function migrateDesks(seatObj){
  const list=(seatObj&&seatObj.desks)||[];
  if(!list.length)return[];
  if(seatObj.unit==="px")return list;
  if(list[0].col!=null&&list[0].x==null){
    const maxRow=list.reduce((m,d)=>Math.max(m,d.row||0),0);
    const rows=maxRow+1;
    const pitchX=ROOM_W/SEAT_COLS,pitchY=Math.max(DESK_H+GAP_Y,480/Math.max(1,rows));
    return list.map(d=>({id:d.id,studentId:d.studentId||null,rot:0,x:((d.col||0)+0.5)*pitchX,y:80+(d.row||0)*pitchY}));
  }
  return list.map(d=>({id:d.id,studentId:d.studentId||null,rot:d.rot||0,x:(d.x/100)*ROOM_W,y:(d.y/100)*640}));
}

function initials(name){return name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();}
function firstNameOf(name){return(name||"").trim().split(/\s+/)[0]||"";}
// "Last name" = everything after the first word. For compound Spanish surnames
// ("Maria Garcia Lopez") this correctly sorts under the paternal surname (Garcia) first.
function lastNameOf(name){const p=(name||"").trim().split(/\s+/);return p.length>1?p.slice(1).join(" "):(p[0]||"");}
function studentCompare(a,b,mode){
  if(mode==="last"){const c=lastNameOf(a.name).localeCompare(lastNameOf(b.name));return c||firstNameOf(a.name).localeCompare(firstNameOf(b.name));}
  const c=firstNameOf(a.name).localeCompare(firstNameOf(b.name));return c||lastNameOf(a.name).localeCompare(lastNameOf(b.name));
}
function SortToggle({state,setState}){
  const mode=state.rosterSort||"first";
  return(<div className="st-seg">
    <button className={"btn btn-sm"+(mode==="first"?" btn-primary":" btn-ghost")} onClick={()=>setState(p=>({...p,rosterSort:"first"}))}>First name</button>
    <button className={"btn btn-sm"+(mode==="last"?" btn-primary":" btn-ghost")} onClick={()=>setState(p=>({...p,rosterSort:"last"}))}>Last name</button>
  </div>);
}

function SeatingView({state,setState,toast}){
  const sections=useMemo(()=>[...new Set(state.students.map(s=>s.section).filter(Boolean))].sort(),[state.students]);
  const [section,setSection]=useState(sections[0]||"");
  useEffect(()=>{if(sections.length&&!sections.includes(section))setSection(sections[0]);},[sections]);
  const [mode,setMode]=useState("teach");
  const [active,setActive]=useState(null);
  const [noteFor,setNoteFor]=useState(null);
  const [noteText,setNoteText]=useState("");
  const [sel,setSel]=useState(null); // {kind:'student'|'desk', id}
  const [snap,setSnap]=useState(null);
  const [heat,setHeat]=useState(false);
  const [heatStd,setHeatStd]=useState(null);
  const [groupSize,setGroupSize]=useState(4);
  const lp=useRef({t:null,moved:false,fired:false});
  const saveTimer=useRef(null);
  const commitRef=useRef(()=>{});
  const canvasRef=useRef(null);
  const drag=useRef(null); // {id,moved,startX,startY}
  const today=todayISO();

  const studById=useMemo(()=>{const m={};state.students.forEach(s=>m[s.id]=s);return m;},[state.students]);
  const roster=useMemo(()=>state.students.filter(s=>s.section===section),[state.students,section]);
  const seat=(state.seating||{})[section]||{desks:[]};
  const desks=useMemo(()=>migrateDesks(seat),[seat]);
  const seatedIds=new Set(desks.filter(d=>d.studentId).map(d=>d.studentId));
  const unassigned=roster.filter(s=>!seatedIds.has(s.id));
  const roomHeight=useMemo(()=>Math.max(640,...desks.map(d=>d.y),0)+DESK_H+70,[desks]);

  const setSeat=fn=>setState(p=>{const s={...(p.seating||{})};const cur={desks:migrateDesks(s[section]||{desks:[]}),unit:"px"};const next=fn(cur);s[section]={...next,unit:"px"};return{...p,seating:s};});
  const ev=sid=>(((state.evidence||{})[today]||{})[sid])||{notes:[],followup:false,completed:false};
  const setEv=(sid,fn)=>setState(p=>{const evd={...(p.evidence||{})};const day={...(evd[today]||{})};const cur=day[sid]||{notes:[],followup:false,completed:false};day[sid]=fn({...cur,notes:[...(cur.notes||[])]});evd[today]=day;return{...p,evidence:evd};});

  // heat standards
  const heatCands=useMemo(()=>{
    const norm={};allStandardDomains().forEach(d=>d.standards.forEach(s=>{norm[normStd(s.code)]={code:s.code};}));
    const canon=new Set();
    roster.forEach(st=>{const rec=state.mastery[st.id]||{};Object.keys(rec).forEach(k=>{if(rec[k]>0){let n=normStd(k),c=n;Object.keys(norm).forEach(cn=>{if(cn===n||n.startsWith(cn+".")||cn.startsWith(n+"."))c=cn;});canon.add(c);}});});
    return [...canon].map(nrm=>{let a=0,m=0;roster.forEach(st=>{const L=lvlOf(st.id,nrm);if(L>0){a++;if(L>=3)m++;}});return{norm:nrm,code:norm[nrm]?norm[nrm].code:nrm.toUpperCase(),pct:a?Math.round(m/a*100):0};}).sort((x,y)=>x.pct-y.pct);
  },[roster,state.mastery]);
  function lvlOf(sid,nrm){const rec=state.mastery[sid]||{};let mx=0;Object.keys(rec).forEach(k=>{const n=normStd(k);if((n===nrm||n.startsWith(nrm+".")||nrm.startsWith(n+"."))&&rec[k]>mx)mx=rec[k];});return mx;}
  const heatNorm=(heatStd&&heatCands.find(c=>c.norm===heatStd))?heatStd:(heatCands[0]&&heatCands[0].norm);

  // actions
  const addDesk=()=>{toast.checkpoint&&toast.checkpoint();setSeat(s=>({...s,desks:[...s.desks,{id:uid(),x:ROOM_W/2,y:roomHeight/2,rot:0,studentId:null}]}));};
  const clearSeats=()=>{toast.checkpoint&&toast.checkpoint();setSeat(s=>({...s,desks:s.desks.map(d=>({...d,studentId:null}))}));setSel(null);};
  const removeDesk=id=>{toast.checkpoint&&toast.checkpoint();setSeat(s=>({...s,desks:s.desks.filter(d=>d.id!==id)}));setSel(null);};
  const seatStudent=(deskId,sid)=>{toast.checkpoint&&toast.checkpoint();setSeat(s=>({...s,desks:s.desks.map(d=>d.id===deskId?{...d,studentId:sid}:d)}));};
  const createSeatedAt=(x,y,sid)=>{toast.checkpoint&&toast.checkpoint();setSeat(s=>({...s,desks:[...s.desks,{id:uid(),x,y,rot:0,studentId:sid}]}));};
  const rotateDesk=(id,delta)=>setSeat(s=>({...s,desks:s.desks.map(d=>d.id===id?{...d,rot:((d.rot||0)+delta+360)%360}:d)}));

  const applyLayout=kind=>{
    const n=desks.length||roster.length;
    if(!n)return;
    if(!desks.length&&!window.confirm(`Seat all ${roster.length} students in ${section} using this layout?`))return;
    toast.checkpoint&&toast.checkpoint();
    const list=desks.length?desks:roster.map(st=>({id:uid(),studentId:st.id,rot:0}));
    let positions;
    if(kind==="rows")positions=genRows(list.length);
    else if(kind==="groups")positions=genGroups(list.length,groupSize);
    else if(kind==="horseshoe")positions=genHorseshoe(list.length);
    else positions=genDoubleHorseshoe(list.length);
    setSeat(s=>({...s,desks:list.map((d,i)=>({id:d.id,studentId:d.studentId||null,rot:d.rot||0,x:positions[i].x,y:positions[i].y}))}));
  };

  const commitNote=()=>{
    const info=noteFor;const txt=noteText.trim();
    if(saveTimer.current){clearTimeout(saveTimer.current);saveTimer.current=null;}
    if(info&&txt){toast.checkpoint&&toast.checkpoint();setEv(info.sid,c=>({...c,notes:[...c.notes,{id:uid(),text:txt,ts:Date.now(),kind:info.kind}]}));}
    setNoteFor(null);setNoteText("");setActive(null);
  };
  commitRef.current=commitNote;
  const discardNote=()=>{if(saveTimer.current){clearTimeout(saveTimer.current);saveTimer.current=null;}setNoteFor(null);setNoteText("");};
  useEffect(()=>{
    if(saveTimer.current)clearTimeout(saveTimer.current);
    if(noteFor&&noteText.trim().length>0)saveTimer.current=setTimeout(()=>commitRef.current(),1400);
    return()=>{if(saveTimer.current)clearTimeout(saveTimer.current);};
  },[noteText,noteFor]);
  useEffect(()=>()=>{commitRef.current();},[]);
  const flagFollow=sid=>{toast.checkpoint&&toast.checkpoint();setEv(sid,c=>({...c,followup:true,completed:false}));setActive(null);};
  const markComplete=sid=>{toast.checkpoint&&toast.checkpoint();setEv(sid,c=>({...c,followup:false,completed:true}));setActive(null);};
  const delNote=(sid,nid)=>{toast.checkpoint&&toast.checkpoint();setEv(sid,c=>({...c,notes:c.notes.filter(n=>n.id!==nid)}));};

  const ptToPx=(clientX,clientY)=>{
    const r=canvasRef.current.getBoundingClientRect();
    const x=((clientX-r.left)/r.width)*ROOM_W;
    const y=((clientY-r.top)/r.height)*roomHeight;
    return{x:Math.max(50,Math.min(ROOM_W-50,x)),y:Math.max(40,Math.min(roomHeight-30,y))};
  };

  // TEACH mode desk gestures (tap = quick actions, long-press = snapshot)
  const onTeachDown=(e,d)=>{if(!d.studentId)return;
    if(e.target.closest(".st-tools")||e.target.closest(".st-note-input"))return;
    lp.current={t:null,moved:false,fired:false};
    lp.current.t=setTimeout(()=>{lp.current.t=null;if(!lp.current.moved){lp.current.fired=true;commitRef.current();setSnap(d.studentId);setActive(null);}},480);};
  const onTeachMove=()=>{lp.current.moved=true;if(lp.current.t){clearTimeout(lp.current.t);lp.current.t=null;}};
  const onTeachUp=(e,d)=>{
    if(lp.current.t){clearTimeout(lp.current.t);lp.current.t=null;}
    if(lp.current.fired){lp.current.fired=false;return;}
    if(e.target.closest(".st-tools")||e.target.closest(".st-note-input"))return;
    if(noteFor&&noteFor.deskId===d.id)return;
    commitRef.current();
    if(d.studentId)setActive(a=>a===d.id?null:d.id);
  };

  // ARRANGE mode: drag to reposition freely, tap to select (rotate/unseat/remove)
  const onArrangeDown=(e,d)=>{
    e.stopPropagation();
    if(sel&&sel.kind==="student"){seatStudent(d.id,sel.id);setSel(null);return;}
    drag.current={id:d.id,moved:false,startX:e.clientX,startY:e.clientY};
    e.currentTarget.setPointerCapture&&e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onArrangeMove=e=>{
    if(!drag.current)return;
    const dx=Math.abs(e.clientX-drag.current.startX),dy=Math.abs(e.clientY-drag.current.startY);
    if(dx>6||dy>6)drag.current.moved=true;
    if(drag.current.moved){
      const p=ptToPx(e.clientX,e.clientY);
      setSeat(s=>({...s,desks:s.desks.map(x=>x.id===drag.current.id?{...x,x:p.x,y:p.y}:x)}));
    }
  };
  const onArrangeUp=(e,d)=>{
    if(!drag.current){return;}
    const wasDrag=drag.current.moved;
    drag.current=null;
    if(!wasDrag)setSel(cur=>(cur&&cur.kind==="desk"&&cur.id===d.id)?null:{kind:"desk",id:d.id});
  };
  const onCanvasClick=e=>{
    if(mode!=="arrange")return;
    if(e.target.closest(".st-desk"))return; // handled by desk's own handlers
    if(sel&&sel.kind==="student"){const p=ptToPx(e.clientX,e.clientY);createSeatedAt(p.x,p.y,sel.id);setSel(null);}
    else if(sel&&sel.kind==="desk")setSel(null);
  };

  if(!state.students.length)return(<div className="content"><div className="empty"><div className="empty-ic"><I d={ic.seat} s={24}/></div><h3>Add your students first</h3><p>Your seating chart is built from your class roster. Add students in Students &amp; mastery, then arrange their desks here.</p></div></div>);

  const selectedDesk=sel&&sel.kind==="desk"?desks.find(d=>d.id===sel.id):null;

  return(<div className="content">
    <div className="st-toolbar no-print">
      {sections.length>1&&<div className="st-seg">{sections.map(s=><button key={s} className={"btn btn-sm"+(section===s?" btn-primary":" btn-ghost")} onClick={()=>{setSection(s);setActive(null);setSel(null);}}>{s}</button>)}</div>}
      <div className="st-seg">
        <button className={"btn btn-sm"+(mode==="teach"?" btn-primary":" btn-ghost")} onClick={()=>{setMode("teach");setSel(null);}}>Teach</button>
        <button className={"btn btn-sm"+(mode==="arrange"?" btn-primary":" btn-ghost")} onClick={()=>{setMode("arrange");commitRef.current();}}>Arrange</button>
      </div>
      {mode==="teach"&&<>
        <button className={"toggle btn btn-sm"+(heat?" btn-primary":"")} onClick={()=>setHeat(h=>!h)} style={{marginLeft:sections.length>1?0:"auto"}}>{heat?"Heat on":"Color by mastery"}</button>
        {heat&&heatCands.length>0&&<select className="select" style={{width:"auto",padding:"6px 10px",fontSize:12.5}} value={heatNorm||""} onChange={e=>setHeatStd(e.target.value)}>{heatCands.map(c=><option key={c.norm} value={c.norm}>{c.code} · {c.pct}%</option>)}</select>}
        <button className="btn btn-primary btn-sm" style={{marginLeft:"auto"}} onClick={()=>window.print()}><I d={ic.file} s={14}/> Print</button>
      </>}
    </div>

    {mode==="arrange"&&<div className="no-print" style={{marginBottom:14}}>
      <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:10}}>
        {sel&&sel.kind==="student"?"Tap a desk to seat them, or tap an empty spot to create a new one there.":"Drag any desk to reposition it. Tap a desk to rotate, unseat, or remove it."}
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
        <button className="btn btn-sm" onClick={()=>applyLayout("rows")}>Rows</button>
        <span style={{display:"inline-flex",alignItems:"center",gap:6}}>
          <button className="btn btn-sm" onClick={()=>applyLayout("groups")}>Groups</button>
          <button className="icon-btn" style={{width:28,height:28}} onClick={()=>setGroupSize(g=>Math.max(2,g-1))}>–</button>
          <span style={{fontSize:12,minWidth:14,textAlign:"center"}}>{groupSize}</span>
          <button className="icon-btn" style={{width:28,height:28}} onClick={()=>setGroupSize(g=>Math.min(6,g+1))}>+</button>
        </span>
        <button className="btn btn-sm" onClick={()=>applyLayout("horseshoe")}>Horseshoe (U)</button>
        <button className="btn btn-sm" onClick={()=>applyLayout("doubleU")}>Double horseshoe</button>
        <button className="btn btn-sm" onClick={addDesk}><I d={ic.plus} s={13}/> Add one desk</button>
        <button className="btn btn-sm" onClick={clearSeats}>Clear seats</button>
      </div>
      <div className="st-roster">
        {unassigned.length?unassigned.map(s=><button key={s.id} className={"st-chip"+(sel&&sel.kind==="student"&&sel.id===s.id?" held":"")} onClick={()=>setSel(sel&&sel.kind==="student"&&sel.id===s.id?null:{kind:"student",id:s.id})}>{s.name}</button>):<span style={{fontSize:12.5,color:"var(--muted-2)"}}>Everyone is seated.</span>}
      </div>
      {selectedDesk&&<div className="card" style={{padding:"12px 16px",marginTop:12,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span style={{fontSize:12.5,fontWeight:600}}>{selectedDesk.studentId?studById[selectedDesk.studentId]?.name:"Empty desk"}</span>
        <button className="btn btn-sm" onClick={()=>rotateDesk(selectedDesk.id,-45)}>Rotate ↺</button>
        <button className="btn btn-sm" onClick={()=>rotateDesk(selectedDesk.id,45)}>Rotate ↻</button>
        {selectedDesk.studentId&&<button className="btn btn-sm" onClick={()=>{seatStudent(selectedDesk.id,null);}}>Unseat</button>}
        <button className="btn btn-sm" style={{color:"var(--terra-deep)"}} onClick={()=>removeDesk(selectedDesk.id)}>Remove desk</button>
        <button className="btn btn-sm" style={{marginLeft:"auto"}} onClick={()=>setSel(null)}>Done</button>
      </div>}
    </div>}

    <div className="st-canvas-scroll">
    <div ref={canvasRef} className={"st-canvas-wrap report-doc"+(heat?" st-heat":"")} style={{height:roomHeight}} onClick={onCanvasClick}>
      <div className="print-only" style={{position:"absolute",top:10,left:14,zIndex:5}}><div className="serif" style={{fontSize:19,fontWeight:600}}>Seating chart · {section}</div><div style={{fontSize:12,color:"var(--muted)"}}>{prettyLong(today)}</div></div>
      <div className="st-board"></div><div className="st-board-label">Front of room</div>
      {desks.map(d=>{
        const s=d.studentId?studById[d.studentId]:null;
        const e=s?ev(s.id):null;
        const observed=e&&e.notes.length>0;
        const isActive=mode==="teach"&&active===d.id;
        const isSel=mode==="arrange"&&sel&&sel.kind==="desk"&&sel.id===d.id;
        const lv=heat&&s&&heatNorm?lvlOf(s.id,heatNorm):0;
        const commonProps=mode==="teach"
          ?{onPointerDown:ev2=>onTeachDown(ev2,d),onPointerMove:onTeachMove,onPointerUp:ev2=>onTeachUp(ev2,d),onPointerCancel:onTeachMove}
          :{onPointerDown:ev2=>onArrangeDown(ev2,d),onPointerMove:onArrangeMove,onPointerUp:ev2=>onArrangeUp(ev2,d),onPointerCancel:onArrangeMove};
        return(<div key={d.id} className={"st-desk"+(isActive?" active":"")+(isSel?" sel":"")} data-lv={lv||""}
          style={{left:d.x+"px",top:d.y+"px",transform:`translate(-50%,-50%) rotate(${d.rot||0}deg)`}}
          {...commonProps}>
          {s?(<>
            <div className="st-top"><div className="st-avatar">{initials(s.name)}</div><div className="st-flag" style={{background:s.flag==="intervention"?"var(--terra)":s.flag==="enrichment"?"var(--olive)":"transparent"}}/></div>
            <div className="st-name">{s.name}</div>
          </>)
            :<div className="st-empty-label">{mode==="arrange"?"Tap to select":"Empty"}</div>}

          {isActive&&s&&!noteFor&&<div className="st-tools">
            <button className="st-tool" onClick={()=>{setNoteFor({deskId:d.id,sid:s.id,kind:"voice"});setNoteText("");}}><I d={ic.mic} s={15}/>Voice</button>
            <button className="st-tool" onClick={()=>{setNoteFor({deskId:d.id,sid:s.id,kind:"work"});setNoteText("");}}><I d={ic.cam} s={15}/>Work</button>
            <button className="st-tool" onClick={()=>flagFollow(s.id)}><I d={ic.clock} s={15}/>Follow up</button>
            <button className="st-tool done" onClick={()=>markComplete(s.id)}><I d={ic.check} s={15}/>Complete</button>
          </div>}

          {isActive&&s&&noteFor&&noteFor.deskId===d.id&&<div className="st-note-input">
            <textarea className="textarea" style={{minHeight:54,fontSize:13}} autoFocus value={noteText} onChange={e2=>setNoteText(e2.target.value)}
              placeholder={noteFor.kind==="voice"?"Tap your keyboard mic and speak…":"Note about the work sample (photo capture coming soon)…"}/>
            <div style={{fontSize:10.5,color:"var(--muted-2)"}}>Saves automatically when you pause</div>
            <div style={{display:"flex",gap:7}}><button className="st-mini" onClick={discardNote}>Cancel</button><button className="st-mini" style={{background:"var(--olive)",color:"#fff",borderColor:"var(--olive)"}} onClick={commitNote}>Save now</button></div>
          </div>}

          {mode==="teach"&&observed&&<div className="st-fold"/>}
          {mode==="teach"&&e&&e.followup&&<div className="st-clock"><I d={ic.clock} s={11}/></div>}
        </div>);
      })}
    </div>
    </div>

    {mode==="teach"&&<div className="no-print" style={{fontSize:12,color:"var(--muted)",marginTop:12,lineHeight:1.55}}>Tap a desk for quick actions · press &amp; hold for the Student Snapshot · the gold page means evidence today, the red clock means follow-up.</div>}

    {snap&&<SeatSnapshot student={studById[snap]} ev={ev(snap)} state={state} onClose={()=>setSnap(null)} onDelNote={nid=>delNote(snap,nid)} lvlOf={lvlOf}/>}
  </div>);
}

function SeatSnapshot({student,ev,state,onClose,onDelNote,lvlOf}){
  if(!student)return null;
  const descOf={};allStandardDomains().forEach(d=>d.standards.forEach(s=>descOf[s.code]=s.desc));
  const rec=state.mastery[student.id]||{};
  const codeLevel={};Object.entries(rec).forEach(([k,lv])=>{if(!lv)return;const n=normStd(k);let hit=null;allStandardDomains().forEach(d=>d.standards.forEach(s=>{const sn=normStd(s.code);if(sn===n||n.startsWith(sn+".")||sn.startsWith(n+"."))hit=s.code;}));if(hit)codeLevel[hit]=Math.max(codeLevel[hit]||0,lv);});
  const items=Object.keys(codeLevel).map(c=>({code:c,desc:descOf[c],level:codeLevel[c]}));
  const strengths=items.filter(x=>x.level>=3).sort((a,b)=>b.level-a.level);
  const growth=items.filter(x=>x.level<3).sort((a,b)=>a.level-b.level);
  const focus=growth[0];
  // timeline across days
  const days=Object.keys(state.evidence||{}).sort().reverse();
  const timeline=[];days.forEach(day=>{const rec2=(state.evidence[day]||{})[student.id];if(rec2&&rec2.notes&&rec2.notes.length)rec2.notes.forEach(n=>timeline.push({day,...n}));});
  const weekAgo=addDays(todayISO(),-7);const weekCount=timeline.filter(t=>t.day>=weekAgo).length;

  return(<>
    <div className="overlay" onClick={onClose}/>
    <div className="panel" role="dialog">
      <button className="panel-close" onClick={onClose}><I d={ic.x}/></button>
      <div className="panel-head">
        <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8}}><span className="pill pill-gray">{student.section}</span><span className="pill pill-gray">{student.language}</span>{student.flag!=="none"&&<span className={"pill "+(student.flag==="intervention"?"pill-terra":"pill-olive")}>{student.flag}</span>}</div>
        <h2 style={{fontSize:20}}>{student.name}</h2>
        <div style={{fontSize:12,color:"var(--muted)",marginTop:5}}>Student Snapshot · everything that needs thought lives here</div>
      </div>
      <div className="panel-body">
        <div className="p-sec"><div className="p-sec-t">Instructional focus</div>{focus?<div className="p-body" style={{display:"flex",gap:8,alignItems:"center"}}><LvBadge lv={focus.level}/><b style={{fontFamily:"ui-monospace,monospace",fontSize:12.5}}>{focus.code}</b> {focus.desc}</div>:<div className="p-body" style={{color:"var(--muted)"}}>No growth-area standards recorded yet.</div>}</div>

        <div className="p-sec"><div className="p-sec-t">Today's observations</div>
          {ev.notes.length?ev.notes.map(n=>(<div key={n.id} style={{display:"flex",gap:8,alignItems:"flex-start",padding:"7px 0",borderBottom:"1px solid var(--border)"}}>
            <span className="pill pill-gray" style={{fontSize:10}}>{n.kind==="work"?"work":"note"}</span>
            <span style={{flex:1,fontSize:13.5,color:"var(--ink-2)"}}>{n.text}</span>
            <button className="mini-x" style={{width:26,height:26,flex:"0 0 26px"}} onClick={()=>onDelNote(n.id)}><I d={ic.x} s={12}/></button>
          </div>)):<div className="p-body" style={{color:"var(--muted)"}}>Nothing captured today. Tap the desk to add a quick note.</div>}
          {ev.followup&&<div className="pill pill-terra" style={{marginTop:8}}>Follow-up flagged</div>}
          {ev.completed&&!ev.followup&&<div className="pill pill-olive" style={{marginTop:8}}>Worked with today</div>}
        </div>

        {!!strengths.length&&<div className="p-sec"><div className="p-sec-t">Strengths</div>{strengths.slice(0,6).map((x,i)=><div key={i} style={{display:"flex",gap:8,alignItems:"center",padding:"4px 0",fontSize:13}}><LvBadge lv={x.level}/><b style={{fontFamily:"ui-monospace,monospace",fontSize:12}}>{x.code}</b><span style={{color:"var(--ink-2)"}}>{x.desc}</span></div>)}</div>}
        {!!growth.length&&<div className="p-sec"><div className="p-sec-t">Growth areas</div>{growth.slice(0,6).map((x,i)=><div key={i} style={{display:"flex",gap:8,alignItems:"center",padding:"4px 0",fontSize:13}}><LvBadge lv={x.level}/><b style={{fontFamily:"ui-monospace,monospace",fontSize:12}}>{x.code}</b><span style={{color:"var(--ink-2)"}}>{x.desc}</span></div>)}</div>}

        <div className="p-sec"><div className="p-sec-t">Evidence timeline</div>
          <div className="p-body" style={{marginBottom:8,color:"var(--muted)"}}>{timeline.length} note{timeline.length===1?"":"s"} on record · {weekCount} this week</div>
          {timeline.slice(0,6).map((t,i)=><div key={i} style={{display:"flex",gap:10,padding:"5px 0",fontSize:12.5,borderBottom:"1px solid var(--border)"}}><span style={{color:"var(--muted)",minWidth:60}}>{pretty(t.day)}</span><span style={{color:"var(--ink-2)"}}>{t.text}</span></div>)}
        </div>

        <div className="p-sec"><div className="p-sec-t">Prerequisite skills</div><div className="p-body" style={{color:"var(--muted)"}}>Prerequisite mapping arrives with the standards-progression view — coming later.</div></div>

function LockScreen({onUnlock}){
  const [pw,setPw]=useState("");const [err,setErr]=useState("");
  const submit=()=>{if(String(hashStr(pw))===localStorage.getItem("teacher-os-lock")){sessionStorage.setItem("teacher-os-unlocked","1");onUnlock();}else{setErr("Incorrect passcode.");setPw("");}};
  return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",padding:20}}>
    <div className="card" style={{width:"min(360px,100%)",padding:"32px 30px"}}>
      <div className="brand" style={{padding:"0 0 16px"}}><div className="brand-mark">N</div><div><div className="brand-name">Teacher OS</div><div className="brand-sub">Mrs. Nava · Grade 4</div></div></div>
      <h2 style={{fontSize:18,marginBottom:4}}>Locked</h2>
      <p style={{fontSize:12.5,color:"var(--muted)",marginTop:0,marginBottom:16}}>Enter your passcode to open your planner.</p>
      <input className="input" type="password" inputMode="text" value={pw} autoFocus onChange={e=>setPw(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")submit();}}/>
      {err&&<div style={{color:"var(--terra-deep)",fontSize:12.5,marginTop:10}}>{err}</div>}
      <button className="btn btn-primary" style={{width:"100%",justifyContent:"center",marginTop:16}} onClick={submit}>Unlock</button>
    </div>
  </div>);
}
function PasscodeCard({toast}){
  const [,bump]=useState(0);const rr=()=>bump(x=>x+1);
  const has=!!localStorage.getItem("teacher-os-lock");
  const [mode,setMode]=useState("idle");
  const [cur,setCur]=useState("");const [a,setA]=useState("");const [b,setB]=useState("");const [err,setErr]=useState("");
  const reset=()=>{setCur("");setA("");setB("");setErr("");setMode("idle");};
  const okCur=()=>String(hashStr(cur))===localStorage.getItem("teacher-os-lock");
  const setPass=()=>{if(a.length<4){setErr("Use at least 4 characters.");return;}if(a!==b){setErr("The two entries don't match.");return;}localStorage.setItem("teacher-os-lock",String(hashStr(a)));sessionStorage.setItem("teacher-os-unlocked","1");toast.show("Passcode set for this device");reset();rr();};
  const change=()=>{if(!okCur()){setErr("Current passcode is incorrect.");return;}if(a.length<4){setErr("Use at least 4 characters.");return;}if(a!==b){setErr("The two entries don't match.");return;}localStorage.setItem("teacher-os-lock",String(hashStr(a)));toast.show("Passcode changed");reset();rr();};
  const off=()=>{if(!okCur()){setErr("Current passcode is incorrect.");return;}localStorage.removeItem("teacher-os-lock");sessionStorage.removeItem("teacher-os-unlocked");toast.show("Passcode removed");reset();rr();};

  return(<div className="card" style={{padding:24,marginTop:18}}>
    <div className="form-sec-t" style={{marginTop:0}}>Passcode lock · this device</div>
    {CLOUD?(<p style={{fontSize:13,color:"var(--muted)",margin:0}}>You're signed in with sync, which already protects this app with your account — a separate device passcode isn't needed.</p>):(<>
      <p style={{fontSize:13,color:"var(--muted)",marginTop:0,lineHeight:1.6}}>Asks for a passcode when the app opens on this device — a privacy curtain for your iPad, like your labs. It's a deterrent, not a vault (someone technical could read it in the page source), and it saves only on this device. If you ever forget it, you'd reset by clearing the site's data — so <b>Export a backup first</b>.</p>
      {!has&&mode!=="set"&&<div style={{display:"flex",alignItems:"center",gap:12}}><span className="pill pill-gray">Off</span><button className="btn btn-primary btn-sm" onClick={()=>setMode("set")}>Set a passcode</button></div>}
      {!has&&mode==="set"&&<div style={{maxWidth:320}}>
        <label className="fl">New passcode</label><input className="input" type="password" value={a} onChange={e=>setA(e.target.value)} style={{marginBottom:10}}/>
        <label className="fl">Confirm passcode</label><input className="input" type="password" value={b} onChange={e=>setB(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")setPass();}}/>
        {err&&<div style={{color:"var(--terra-deep)",fontSize:12.5,marginTop:8}}>{err}</div>}
        <div style={{display:"flex",gap:8,marginTop:12}}><button className="btn btn-sm" onClick={reset}>Cancel</button><button className="btn btn-primary btn-sm" onClick={setPass}>Set passcode</button></div>
      </div>}
      {has&&mode==="idle"&&<div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}><span className="pill pill-olive">On</span><button className="btn btn-sm" onClick={()=>setMode("change")}>Change</button><button className="btn btn-sm" style={{color:"var(--terra-deep)"}} onClick={()=>setMode("off")}>Turn off</button></div>}
      {has&&mode==="change"&&<div style={{maxWidth:320}}>
        <label className="fl">Current passcode</label><input className="input" type="password" value={cur} onChange={e=>setCur(e.target.value)} style={{marginBottom:10}}/>
        <label className="fl">New passcode</label><input className="input" type="password" value={a} onChange={e=>setA(e.target.value)} style={{marginBottom:10}}/>
        <label className="fl">Confirm new</label><input className="input" type="password" value={b} onChange={e=>setB(e.target.value)}/>
        {err&&<div style={{color:"var(--terra-deep)",fontSize:12.5,marginTop:8}}>{err}</div>}
        <div style={{display:"flex",gap:8,marginTop:12}}><button className="btn btn-sm" onClick={reset}>Cancel</button><button className="btn btn-primary btn-sm" onClick={change}>Save</button></div>
      </div>}
      {has&&mode==="off"&&<div style={{maxWidth:320}}>
        <label className="fl">Enter current passcode to turn off</label><input className="input" type="password" value={cur} onChange={e=>setCur(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")off();}}/>
        {err&&<div style={{color:"var(--terra-deep)",fontSize:12.5,marginTop:8}}>{err}</div>}
        <div style={{display:"flex",gap:8,marginTop:12}}><button className="btn btn-sm" onClick={reset}>Cancel</button><button className="btn btn-sm" style={{background:"var(--terra)",color:"#fff",borderColor:"var(--terra)"}} onClick={off}>Turn off lock</button></div>
      </div>}
    </>)}
  </div>);
}

const GOAL_TARGETS=[{v:2,label:"Approaching"},{v:3,label:"Meets"},{v:4,label:"Exceeds"}];
function goalLevel(state,sid,norm){const rec=state.mastery[sid]||{};let mx=0;Object.keys(rec).forEach(k=>{const n=normStd(k);if((n===norm||n.startsWith(norm+".")||norm.startsWith(n+"."))&&rec[k]>mx)mx=rec[k];});return mx;}
function goalStatus(g,state){
  if(g.status==="dropped")return "dropped";
  if(g.status==="met")return "met";
  const overdue=g.targetDate&&g.targetDate<todayISO();
  if(g.kind==="standard"){
    const cur=goalLevel(state,g.studentId,g.standardNorm);
    if(cur>=g.targetLevel)return "met-auto";
    if(cur>(g.baseline||0))return "progressing";
    return overdue?"behind":"active";
  }
  return overdue?"behind":"active";
}
const GOAL_STATUS_META={
  "met":{label:"Goal met",bg:"var(--olive)",fg:"#fff"},
  "met-auto":{label:"Target reached",bg:"var(--olive)",fg:"#fff"},
  "progressing":{label:"Progressing",bg:"#F1E6D3",fg:"#8B6A3C"},
  "active":{label:"In progress",bg:"var(--surface-2)",fg:"var(--ink-2)"},
  "behind":{label:"Needs attention",bg:"var(--terra-soft)",fg:"var(--terra-deep)"},
  "dropped":{label:"Dropped",bg:"var(--surface-2)",fg:"var(--muted)"},
};
function GoalStatusPill({s}){const m=GOAL_STATUS_META[s]||GOAL_STATUS_META.active;return<span className="gl-status" style={{background:m.bg,color:m.fg}}>{m.label}</span>;}
function LevelBar({current,target,baseline}){
  return(<div className="gl-bar">
    {[1,2,3,4].map(lv=>(<div key={lv} className={"gl-seg"+(current>=lv?" on":"")+(current===lv?" cur":"")}>
      {target===lv&&<div className="gl-flag"/>}
      {baseline&&baseline===lv&&<div className="gl-dot"/>}
    </div>))}
  </div>);
}

function AddGoalModal({student,state,onClose,onSave}){
  const [kind,setKind]=useState("standard");
  const [norm,setNorm]=useState("");
  const [targetLevel,setTargetLevel]=useState(3);
  const [title,setTitle]=useState("");
  const [notes,setNotes]=useState("");
  const [targetDate,setTargetDate]=useState(addDays(todayISO(),28));
  const allStds=useMemo(()=>allStandardDomains().flatMap(d=>d.standards.map(s=>({...s,norm:normStd(s.code)}))),[]);
  const valid=kind==="standard"?!!norm:title.trim().length>0;

  const submit=()=>{
    if(!valid)return;
    if(kind==="standard"){
      const std=allStds.find(s=>s.norm===norm);
      const baseline=goalLevel(state,student.id,norm);
      onSave({studentId:student.id,kind:"standard",standardCode:std.code,standardNorm:norm,targetLevel,baseline,targetDate,notes});
    }else{
      onSave({studentId:student.id,kind:"custom",title:title.trim(),notes,targetDate});
    }
  };

  return(<div className="modal-wrap" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal" style={{maxWidth:520}}>
      <div className="modal-head"><div><div className="eyebrow" style={{marginBottom:2}}>New goal</div><h2 style={{fontSize:18}}>For {student.name}</h2></div>
        <button className="panel-close" style={{position:"static"}} onClick={onClose}><I d={ic.x}/></button></div>
      <div className="modal-body">
        <div className="st-seg" style={{marginBottom:16,width:"fit-content"}}>
          <button className={"btn btn-sm"+(kind==="standard"?" btn-primary":" btn-ghost")} onClick={()=>setKind("standard")}>Standard</button>
          <button className={"btn btn-sm"+(kind==="custom"?" btn-primary":" btn-ghost")} onClick={()=>setKind("custom")}>Custom</button>
        </div>

        {kind==="standard"?(<>
          <Field label="Standard"><select className="select" value={norm} onChange={e=>setNorm(e.target.value)}>
            <option value="">Choose a standard…</option>
            {allStandardDomains().map(d=><optgroup label={d.domain+" · "+d.name} key={d.domain}>{d.standards.map(s=><option key={s.code} value={normStd(s.code)}>{s.code} — {s.desc}</option>)}</optgroup>)}
          </select></Field>
          <Field label="Target"><div style={{display:"flex",gap:8}}>{GOAL_TARGETS.map(t=><button key={t.v} className={"btn btn-sm"+(targetLevel===t.v?" btn-primary":"")} style={{flex:1}} onClick={()=>setTargetLevel(t.v)}>{t.label}</button>)}</div></Field>
          {norm&&<div className="hint" style={{marginTop:-8,marginBottom:14}}>Starting point: {M_LEVELS[goalLevel(state,student.id,norm)].label} (from the mastery grid)</div>}
        </>):(<>
          <Field label="Goal title"><input className="input" value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Raise hand before speaking during group work"/></Field>
        </>)}

        <Field label="Target date"><input className="input" type="date" value={targetDate} onChange={e=>setTargetDate(e.target.value)}/></Field>
        <Field label="Notes / support plan" hint="What you'll do to help them get there"><textarea className="textarea" value={notes} onChange={e=>setNotes(e.target.value)}/></Field>
      </div>
      <div className="modal-foot"><button className="btn" onClick={onClose}>Cancel</button><button className="btn btn-primary" disabled={!valid} style={!valid?{opacity:.5}:null} onClick={submit}>Save goal</button></div>
    </div>
  </div>);
}

/* ============================================================
   12j. GLOBAL SEARCH  (lessons, students, standards, goals, notes)
============================================================ */
function searchEverything(state,qRaw){
  const q=(qRaw||"").trim().toLowerCase();
  const empty={students:[],lessons:[],goals:[],observations:[],standards:[]};
  if(q.length<2)return empty;

  const students=state.students.filter(s=>s.name.toLowerCase().includes(q)||(s.section||"").toLowerCase().includes(q))
    .slice(0,8).map(s=>({id:s.id,title:s.name,subtitle:[s.section,s.language].filter(Boolean).join(" · ")}));

  const lessons=state.lessons.filter(l=>{
    const hay=[l.title,l.objective,l.teacherNotes,l.studentNotes,(l.standards||[]).join(" "),(l.vocabulary||[]).join(" "),(l.tags||[]).join(" "),(l.targets||[]).join(" ")].join(" ").toLowerCase();
    return hay.includes(q);
  }).slice(0,8).map(l=>({id:l.id,title:l.title,subtitle:`${l.subject} · Q${l.quarter} Mod ${l.module} L${l.lessonNumber}`}));

  const standards=[];
  allStandardDomains().forEach(d=>d.standards.forEach(s=>{if((s.code+" "+s.desc).toLowerCase().includes(q))standards.push({code:s.code,title:s.code,subtitle:s.desc});}));

  const goals=[];
  (state.goals||[]).forEach(g=>{
    const stu=state.students.find(x=>x.id===g.studentId);
    const label=g.kind==="standard"?g.standardCode:g.title;
    const hay=[label,g.notes||"",stu?stu.name:""].join(" ").toLowerCase();
    if(hay.includes(q))goals.push({id:g.id,studentId:g.studentId,title:label,subtitle:stu?stu.name:""});
  });

  const observations=[];
  Object.keys(state.evidence||{}).forEach(day=>{
    const dayRec=state.evidence[day]||{};
    Object.keys(dayRec).forEach(sid=>{
      (dayRec[sid].notes||[]).forEach(n=>{
        if(n.text.toLowerCase().includes(q)){const stu=state.students.find(x=>x.id===sid);observations.push({studentId:sid,title:stu?stu.name:"Student",subtitle:`${pretty(day)} · ${n.text}`});}
      });
    });
  });
  Object.keys(state.reports||{}).forEach(sid=>{
    const r=state.reports[sid];const stu=state.students.find(x=>x.id===sid);if(!stu)return;
    if(r.notes&&r.notes.toLowerCase().includes(q))observations.push({studentId:sid,title:stu.name,subtitle:"Conference note: "+r.notes});
    if(r.goals&&r.goals.toLowerCase().includes(q))observations.push({studentId:sid,title:stu.name,subtitle:"Conference goal: "+r.goals});
  });

  return{students,lessons,goals:goals.slice(0,8),observations:observations.slice(0,8),standards:standards.slice(0,8)};
}
function SearchGroup({title,children}){return(<div style={{marginBottom:14}}><div className="p-sec-t" style={{marginBottom:4}}>{title}</div>{children}</div>);}
function SearchRow({title,subtitle,onClick}){return(<button className="gs-row" onClick={onClick}><div className="srt">{title}</div>{subtitle&&<div className="srs">{subtitle}</div>}</button>);}

function GlobalSearch({state,onClose,onOpenLesson,onOpenStudent,onOpenGoalStudent,onGoToStandards}){
  const [q,setQ]=useState("");
  const r=useMemo(()=>searchEverything(state,q),[state,q]);
  const total=r.students.length+r.lessons.length+r.goals.length+r.observations.length+r.standards.length;
  return(<div className="modal-wrap" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal" style={{maxWidth:560}}>
      <div className="modal-head">
        <div className="search-wrap" style={{margin:0}}><I d={ic.search}/><input className="search" autoFocus placeholder="Search students, lessons, standards, notes…" value={q} onChange={e=>setQ(e.target.value)}/></div>
        <button className="panel-close" style={{position:"static",marginLeft:10}} onClick={onClose}><I d={ic.x}/></button>
      </div>
      <div className="modal-body" style={{paddingTop:10,minHeight:120}}>
        {q.trim().length<2?(<div style={{color:"var(--muted)",fontSize:13,padding:"18px 4px",textAlign:"center"}}>Type at least 2 characters — this searches lessons, students, standards, goals, and every note you've recorded.</div>)
        :total===0?(<div style={{color:"var(--muted)",fontSize:13,padding:"18px 4px",textAlign:"center"}}>No matches for "{q}".</div>)
        :(<>
          {!!r.students.length&&<SearchGroup title="Students">{r.students.map(x=><SearchRow key={x.id} title={x.title} subtitle={x.subtitle} onClick={()=>onOpenStudent(x.id)}/>)}</SearchGroup>}
          {!!r.lessons.length&&<SearchGroup title="Lessons">{r.lessons.map(x=><SearchRow key={x.id} title={x.title} subtitle={x.subtitle} onClick={()=>onOpenLesson(x.id)}/>)}</SearchGroup>}
          {!!r.goals.length&&<SearchGroup title="Goals">{r.goals.map(x=><SearchRow key={x.id} title={x.title} subtitle={x.subtitle} onClick={()=>onOpenGoalStudent(x.studentId)}/>)}</SearchGroup>}
          {!!r.observations.length&&<SearchGroup title="Notes & observations">{r.observations.map((x,i)=><SearchRow key={i} title={x.title} subtitle={x.subtitle} onClick={()=>onOpenStudent(x.studentId)}/>)}</SearchGroup>}
          {!!r.standards.length&&<SearchGroup title="Standards">{r.standards.map(x=><SearchRow key={x.code} title={x.title} subtitle={x.subtitle} onClick={onGoToStandards}/>)}</SearchGroup>}
        </>)}
      </div>
    </div>
  </div>);
}

/* ============================================================
   12k. ATTENDANCE  (daily marking + rate, feeds Conference Reports)
============================================================ */
function attendanceStats(state,studentId){
  let present=0,absent=0,tardy=0,excused=0;
  Object.keys(state.attendance||{}).forEach(date=>{
    const st=(state.attendance[date]||{})[studentId];if(!st)return;
    if(st==="present")present++;else if(st==="absent")absent++;else if(st==="tardy")tardy++;else if(st==="excused")excused++;
  });
  const total=present+absent+tardy+excused;
  const rate=total?Math.round((present+tardy)/total*100):null;
  return{present,absent,tardy,excused,total,missed:absent+excused,rate};
}
const ATT_STATUSES=[{v:"present",short:"P",label:"Present"},{v:"absent",short:"A",label:"Absent"},{v:"tardy",short:"T",label:"Tardy"},{v:"excused",short:"E",label:"Excused"}];

function AttendanceView({state,setState,toast}){
  const sections=useMemo(()=>[...new Set(state.students.map(s=>s.section).filter(Boolean))].sort(),[state.students]);

  const roster=useMemo(()=>[...state.students].filter(s=>section==="All"||s.section===section)
    .sort((a,b)=>(a.section||"").localeCompare(b.section||"")||studentCompare(a,b,state.rosterSort)),[state.students,section,state.rosterSort]);

  const dayRec=(state.attendance||{})[date]||{};
  const markedCount=roster.filter(s=>dayRec[s.id]).length;

  const stepDay=dir=>{
    const idx=sched.instructional.indexOf(date);
    if(idx>=0){const ni=idx+dir;if(ni>=0&&ni<sched.instructional.length){setDate(sched.instructional[ni]);return;}}
    setDate(addDays(date,dir));
  };
  const setStatus=(sid,status)=>{
    toast.checkpoint&&toast.checkpoint();
    setState(p=>{const att={...(p.attendance||{})};const day={...(att[date]||{})};
      day[sid]=day[sid]===status?undefined:status;
      if(day[sid]===undefined)delete day[sid];
      att[date]=day;return{...p,attendance:att};});
  };
  const markAllPresent=()=>{
    toast.checkpoint&&toast.checkpoint();
    setState(p=>{const att={...(p.attendance||{})};const day={...(att[date]||{})};
      roster.forEach(s=>{if(!day[s.id])day[s.id]="present";});att[date]=day;return{...p,attendance:att};});
  };

  const summaryRows=useMemo(()=>roster.map(s=>({s,st:attendanceStats(state,s.id)}))
    .sort((a,b)=>(a.st.rate??101)-(b.st.rate??101)),[roster,state.attendance]);

  if(!state.students.length)return(<div className="content"><div className="empty"><div className="empty-ic"><I d={ic.roll} s={24}/></div><h3>Add your students first</h3><p>Attendance is tracked per student — add your roster in Students &amp; mastery, then come back here.</p></div></div>);

        <button className={"btn btn-sm"+(mode==="take"?" btn-primary":" btn-ghost")} onClick={()=>setMode("take")}>Take attendance</button>
        <button className={"btn btn-sm"+(mode==="summary"?" btn-primary":" btn-ghost")} onClick={()=>setMode("summary")}>Summary</button>
      </div>
      {mode==="summary"&&<button className="btn btn-primary btn-sm" style={{marginLeft:"auto"}} onClick={()=>window.print()}><I d={ic.file} s={14}/> Print</button>}
    </div>

    {mode==="take"?(<>
      <div className="no-print" style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexWrap:"wrap"}}>
        <button className="icon-btn" onClick={()=>stepDay(-1)}><I d={ic.chevL}/></button>
        <div style={{fontWeight:600,fontSize:15,minWidth:170,textAlign:"center"}}>{prettyLong(date)}</div>
        <button className="icon-btn" onClick={()=>stepDay(1)}><I d={ic.chevR}/></button>
        <button className="btn btn-sm" onClick={()=>setDate(todayISO())}>Today</button>
        <span className="pill pill-gray" style={{marginLeft:6}}>{markedCount}/{roster.length} marked</span>
        <SortToggle state={state} setState={setState}/>
        <button className="btn btn-primary btn-sm" style={{marginLeft:"auto"}} onClick={markAllPresent}><I d={ic.check} s={14}/> Mark all present</button>
      </div>

      <div className="card" style={{padding:"6px 18px"}}>
        {roster.length?roster.map(s=>{const cur=dayRec[s.id];
          return(<div className="at-row" key={s.id}>

            <div className="at-btns">

      <div className="report-doc">
        <div className="print-only" style={{marginBottom:16,borderBottom:"2px solid var(--olive)",paddingBottom:12}}>
          <div className="serif" style={{fontSize:20,fontWeight:600}}>Attendance summary · {section}</div>

        </div>
        {summaryRows.length?(<div className="card" style={{overflowX:"auto",padding:0}}>
          <table style={{borderCollapse:"collapse",width:"100%",minWidth:560}}>
            <thead><tr style={{background:"var(--surface-2)"}}>{["Student","Present","Absent","Tardy","Excused","Rate"].map(h=><th key={h} style={{textAlign:"left",padding:"10px 14px",fontSize:11,fontWeight:600,color:"var(--muted)",borderBottom:"1px solid var(--border)"}}>{h}</th>)}</tr></thead>
            <tbody>{summaryRows.map(({s,st},i)=>(<tr key={s.id} style={{background:i%2?"#FCFAF6":"var(--surface)"}}>
              <td style={{padding:"10px 14px",fontSize:13,fontWeight:550,borderBottom:"1px solid var(--border)"}}>{s.name}</td>

        <div className="print-only" style={{whiteSpace:"pre-wrap",fontSize:13,lineHeight:1.55,color:note?"var(--ink)":"var(--muted-2)"}}>{note||"—"}</div>

/* ============================================================
   12m. ASSESSMENT SCORES  (STAR / SBA / custom interims, teacher-set colors)
============================================================ */
function scoreColor(score,def){
  if(!def)return{bg:"var(--surface-2)",fg:"var(--ink-2)"};
  if(score>=def.bands.green)return{bg:"var(--olive-soft)",fg:"var(--olive-deep)"};
  if(score>=def.bands.gold)return{bg:"#F1E6D3",fg:"#8B6A3C"};
  return{bg:"var(--terra-soft)",fg:"var(--terra-deep)"};
}

function BulkScoreEntry({state,defs,onImport}){
  const [testDefId,setTestDefId]=useState(defs[0]?defs[0].id:"");
  const [subject,setSubject]=useState("Math");
  const [win,setWindow]=useState("");
  const [date,setDate]=useState(todayISO());
  const [text,setText]=useState("");
  const parsed=useMemo(()=>{
    const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
    return lines.map(line=>{
      const parts=line.split(/,|\t/).map(x=>x.trim());
      const name=parts[0]||"";const scoreStr=parts[1]||"";
      const score=parseFloat(scoreStr);
      const match=state.students.find(s=>s.name.toLowerCase()===name.toLowerCase());
      return{line,name,score,match,valid:!!match&&!isNaN(score)};
    });
  },[text,state.students]);
  const validCount=parsed.filter(p=>p.valid).length;

  const doImport=()=>{
    const entries=parsed.filter(p=>p.valid).map(p=>({studentId:p.match.id,testDefId,subject,window:win.trim(),date,score:p.score}));
    onImport(entries);setText("");
  };

  return(<div>
    <div className="card" style={{padding:20,marginBottom:16}}>
      <div className="grid2">
        <Field label="Test"><select className="select" value={testDefId} onChange={e=>setTestDefId(e.target.value)}>{defs.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></Field>
        <Field label="Subject"><select className="select" value={subject} onChange={e=>setSubject(e.target.value)}>{["Math","ELA","Science","Other"].map(s=><option key={s}>{s}</option>)}</select></Field>
      </div>
      <div className="grid2">
        <Field label="Window" hint='e.g. "Fall 2026", "Incoming — Spring 2026"'><input className="input" value={win} onChange={e=>setWindow(e.target.value)}/></Field>
        <Field label="Date"><input className="input" type="date" value={date} onChange={e=>setDate(e.target.value)}/></Field>
      </div>
      <Field label="Paste names and scores" hint='One student per line — "Name, Score" (or Name then a tab, then the score)' full>
        <textarea className="textarea" style={{minHeight:160,fontFamily:"ui-monospace,monospace",fontSize:12.5}} value={text} onChange={e=>setText(e.target.value)}
          placeholder={"Ana Valencia, 3\nDiego Ramos, 2\nSofía Torres, 4"}/>
      </Field>
    </div>

    {parsed.length>0&&<div className="card" style={{padding:0,marginBottom:16}}>
      <div style={{padding:"10px 18px",background:"var(--surface-2)",fontSize:12.5,fontWeight:600,borderBottom:"1px solid var(--border)"}}>{validCount} of {parsed.length} lines matched</div>
      {parsed.map((p,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"7px 18px",borderBottom:"1px solid var(--border)",fontSize:12.5}}>
        {p.valid?<span className="pill pill-olive" style={{fontSize:10}}>OK</span>:<span className="pill pill-terra" style={{fontSize:10}}>{p.match?"Bad score":"No match"}</span>}
        <span style={{flex:1,color:"var(--ink-2)"}}>{p.line}</span>
      </div>))}
    </div>}

    <button className="btn btn-primary" disabled={!validCount} style={!validCount?{opacity:.5}:null} onClick={doImport}><I d={ic.upload} s={15}/> Import {validCount||""} score{validCount===1?"":"s"}</button>
  </div>);
}

function App(){
  const [state,setStateRaw]=useState(()=>loadLocal()||EMPTY_STATE);
  const [view,setView]=useState("dashboard");
  const [panel,setPanel]=useState(null);      // {lessonId, date}
  const [editing,setEditing]=useState(null);   // lesson obj or {} for new
  const [toastMsg,setToastMsg]=useState(null);
  const [reportStudent,setReportStudent]=useState(null);
  const [goalStudent,setGoalStudent]=useState(null);
  const [showSearch,setShowSearch]=useState(false);
  const [authUser,setAuthUser]=useState(CLOUD?null:"local"); // null=checking · "local"=no cloud · false=signed out · obj=signed in
  const [showConnect,setShowConnect]=useState(false);
  const [mobileNav,setMobileNav]=useState(false);
  const [locked,setLocked]=useState(()=>{try{return !CLOUD&&!!localStorage.getItem("teacher-os-lock")&&sessionStorage.getItem("teacher-os-unlocked")!=="1";}catch(e){return false;}});
  const skipSave=useRef(false);
  const history=useRef([]);
  const stateRef=useRef(state);
  const [canUndo,setCanUndo]=useState(false);

  const setState=useCallback(updater=>{setStateRaw(prev=>typeof updater==="function"?updater(prev):updater);},[]);
  const checkpoint=useCallback(()=>{history.current.push(stateRef.current);if(history.current.length>40)history.current.shift();setCanUndo(true);},[]);
  const undo=useCallback(()=>{const h=history.current;if(!h.length)return;const prev=h.pop();setCanUndo(h.length>0);setStateRaw(prev);},[]);
  useEffect(()=>{stateRef.current=state;},[state]);

  // Auth (only when Firebase is configured; otherwise stays in local mode)
  useEffect(()=>{
    if(!CLOUD)return;
    if(!initFirebase()){setAuthUser("local");return;} // SDK blocked → degrade to local
    const un=fbAuth.onAuthStateChanged(u=>setAuthUser(u||false));
    return()=>un&&un();
  },[]);

  const synced=fbEnabled&&authUser&&authUser!=="local"&&authUser!==false;

  // Pull + live-sync from Firestore once signed in
  useEffect(()=>{
    if(!synced)return;
    fbDoc.get().then(snap=>{
      if(snap.exists){skipSave.current=true;setStateRaw({...EMPTY_STATE,...snap.data()});}
      else{fbDoc.set(stateRef.current).catch(()=>{});} // fresh cloud → seed it from this device's data
    }).catch(()=>{});
    const unsub=fbDoc.onSnapshot(snap=>{if(snap.exists&&snap.metadata.hasPendingWrites===false){skipSave.current=true;setStateRaw({...EMPTY_STATE,...snap.data()});}},()=>{});
    return()=>unsub&&unsub();
  },[synced]);

  // persist (debounced): always local; cloud only when signed in
  useEffect(()=>{
    if(skipSave.current){skipSave.current=false;return;}
    saveLocal(state);
    if(synced){const id=setTimeout(()=>{fbDoc.set(state).catch(()=>{});},600);return()=>clearTimeout(id);}
  },[state]);

  const sched=useMemo(()=>computeSchedule(state),[state]);

  const toast={
    show:(msg,action,fn)=>{setToastMsg({msg,action,fn});setTimeout(()=>setToastMsg(t=>t&&t.msg===msg?null:t),5000);},
    go:setView,
    checkpoint,
  };
  useEffect(()=>{
    const onKey=e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){e.preventDefault();undo();}
      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();setShowSearch(true);}};
    window.addEventListener("keydown",onKey);return()=>window.removeEventListener("keydown",onKey);
  },[undo]);
  const openLesson=(id,date)=>setPanel({lessonId:id,date});
  const panelLesson=panel?state.lessons.find(l=>l.id===panel.lessonId):null;

  const saveLesson=f=>{
    checkpoint();
    setState(p=>{
      const exists=p.lessons.some(l=>l.id===f.id);
      const lessons=exists?p.lessons.map(l=>l.id===f.id?f:l):[...p.lessons,{...f,id:uid()}];
      return{...p,lessons};
    });
    setEditing(null);
    toast.show(f.id?"Lesson saved":"Lesson added to bank");
  };
  const deleteLesson=id=>{
    checkpoint();
    setState(p=>{const pins={...p.pins};SUBJECTS.forEach(s=>{if(pins[s]){pins[s]={...pins[s]};Object.keys(pins[s]).forEach(d=>{if(pins[s][d]===id)delete pins[s][d];});}});
      return{...p,lessons:p.lessons.filter(l=>l.id!==id),pins};});
    setEditing(null);setPanel(null);toast.show("Lesson deleted");
  };
  const togglePrep=(lid,i)=>setState(p=>{const prep={...p.prep,[lid]:{...(p.prep[lid]||{})}};prep[lid][i]=!prep[lid][i];return{...p,prep};});

  const NAV=[
    {k:"dashboard",label:"Dashboard",icon:ic.home,group:"Plan"},
    {k:"planner",label:"Monthly planner",icon:ic.cal,group:"Plan"},
    {k:"bank",label:"Lesson bank",icon:ic.bank,group:"Plan"},
    {k:"subplans",label:"Sub plans",icon:ic.badge,group:"Plan"},
    {k:"students",label:"Students & mastery",icon:ic.users,group:"Track"},
    {k:"attendance",label:"Attendance",icon:ic.roll,group:"Track"},
    {k:"seating",label:"Seating chart",icon:ic.seat,group:"Track"},
    {k:"goals",label:"Student goals",icon:ic.target,group:"Track"},
    {k:"groups",label:"Small groups",icon:ic.groups,group:"Track"},
    {k:"data",label:"Data dashboard",icon:ic.chart,group:"Track"},
    {k:"testscores",label:"Assessment scores",icon:ic.trend,group:"Track"},
    {k:"reports",label:"Conference reports",icon:ic.file,group:"Track"},
    {k:"year",label:"School year",icon:ic.gear,group:"Setup"},
  ];
  const GROUPS=["Plan","Track","Setup"];
  const TITLES={dashboard:"Dashboard",planner:"Monthly planner",bank:"Lesson bank",subplans:"Sub plans",students:"Students & mastery",attendance:"Attendance",seating:"Seating chart",goals:"Student goals",groups:"Small groups",data:"Data dashboard",testscores:"Assessment scores",reports:"Conference reports",year:"School year"};

  if(CLOUD&&authUser===null)return <Loading/>;
  if(CLOUD&&authUser===false)return <SignIn/>;
  if(locked)return <LockScreen onUnlock={()=>setLocked(false)}/>;

  return(<div className="app">
    <aside className={"sidebar"+(mobileNav?" open":"")}>
      <div className="brand"><div className="brand-mark">N</div><div><div className="brand-name">Teacher OS</div><div className="brand-sub">Mrs. Nava · Grade 4</div></div></div>
      {GROUPS.map(g=>(<React.Fragment key={g}>
        <div className="nav-label">{g}</div>
        {NAV.filter(n=>n.group===g).map(n=><button key={n.k} className={"nav-item"+(view===n.k?" active":"")} onClick={()=>{setView(n.k);setMobileNav(false);}}><I d={n.icon}/>{n.label}</button>)}
      </React.Fragment>))}
      <div className="sidebar-foot">
        <div><span className="sync-dot" style={{background:synced?"var(--olive)":"var(--muted-2)"}}/>{synced?"Synced across devices":"Saved on this device"}</div>
        {synced&&<button className="btn-ghost btn-sm" style={{marginTop:8,padding:"4px 0",color:"var(--muted)",fontSize:11.5}} onClick={()=>fbAuth.signOut()}>Sign out</button>}
        {!CLOUD&&<button className="btn-ghost btn-sm" style={{marginTop:8,padding:"4px 0",color:"var(--olive-deep)",fontSize:11.5,fontWeight:600}} onClick={()=>setShowConnect(true)}>Connect sync across devices</button>}
      </div>
    </aside>
    {mobileNav&&<div className="nav-backdrop" onClick={()=>setMobileNav(false)}/>}

    <main className="main">
      <div className="topbar">
        <button className="menu-btn icon-btn" onClick={()=>setMobileNav(true)}><I d={ic.menu}/></button>
        <span className="ttl">{TITLES[view]}</span>
        {state.schoolYear.name&&<span className="pill pill-gray">{state.schoolYear.name}</span>}
        <div className="spacer"/>
        <button className="btn btn-sm" onClick={()=>setShowSearch(true)} title="Search everything (⌘K)"><I d={ic.search} s={14}/> Search</button>
        <button className="btn btn-sm" disabled={!canUndo} style={!canUndo?{opacity:.45,cursor:"default"}:null} onClick={undo} title="Undo last change (⌘Z)"><I d={ic.undo} s={14}/> Undo</button>
        <button className="btn btn-primary btn-sm" onClick={()=>setEditing({})}><I d={ic.plus} s={14}/> New lesson</button>
      </div>

      {view==="dashboard"&&<Dashboard state={state} sched={sched} onOpen={openLesson} go={setView}/>}
      {view==="planner"&&<Planner state={state} sched={sched} setState={setState} onOpen={openLesson} toast={toast}/>}
      {view==="bank"&&<Bank state={state} sched={sched} setState={setState} onOpen={openLesson} openNew={()=>setEditing({})} toast={toast}/>}
      {view==="subplans"&&<SubPlansView state={state} setState={setState} toast={toast}/>}
      {view==="students"&&<StudentsView state={state} setState={setState} toast={toast} onReport={id=>{setReportStudent(id);setView("reports");}}/>}
      {view==="attendance"&&<AttendanceView state={state} setState={setState} toast={toast}/>}
      {view==="seating"&&<SeatingView state={state} setState={setState} toast={toast}/>}
      {view==="goals"&&<GoalsView state={state} setState={setState} toast={toast} initialStudent={goalStudent}/>}
      {view==="groups"&&<GroupsView state={state}/>}
      {view==="data"&&<DataDashboard state={state} onOpen={openLesson}/>}
      {view==="testscores"&&<TestScoresView state={state} setState={setState} toast={toast}/>}
      {view==="reports"&&<ReportsView state={state} setState={setState} initialStudent={reportStudent}/>}
      {view==="year"&&<SchoolYear state={state} setState={setState} toast={toast}/>}
    </main>

    {panelLesson&&<LessonPanel lesson={panelLesson} dateInfo={panel.date?prettyLong(panel.date):null} prep={state.prep[panelLesson.id]} onPrep={togglePrep} onClose={()=>setPanel(null)} onEdit={()=>{setEditing(panelLesson);setPanel(null);}}/>}
    {editing&&<LessonForm initial={editing} onSave={saveLesson} onClose={()=>setEditing(null)} onDelete={deleteLesson}/>}
    {showConnect&&<ConnectSync onClose={()=>setShowConnect(false)}/>}
    {showSearch&&<GlobalSearch state={state} onClose={()=>setShowSearch(false)}
      onOpenLesson={id=>{setView("bank");openLesson(id);setShowSearch(false);}}
      onOpenStudent={id=>{setReportStudent(id);setView("reports");setShowSearch(false);}}
      onOpenGoalStudent={id=>{setGoalStudent(id);setView("goals");setShowSearch(false);}}
      onGoToStandards={()=>{setView("data");setShowSearch(false);}}/>}

    {toastMsg&&<div className="toast">{toastMsg.msg}{toastMsg.action&&<button onClick={()=>{toastMsg.fn&&toastMsg.fn();setToastMsg(null);}}>{toastMsg.action}</button>}</div>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
