<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teacher OS</title>

     FONTS
============================================================ -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============================================================
   DESIGN TOKENS
============================================================ */
:root{
  --bg:#FAF7F1;            /* warm white */
  --surface:#FFFFFF;
  --surface-2:#F1ECE3;     /* soft gray (warm) */
  --surface-3:#E9E3D8;
  --border:#E4DDD0;
  --border-strong:#D8CFBE;

  --olive:#6C7059;         /* primary accent */
  --olive-deep:#565A46;
  --olive-soft:#E9EBE2;

  --terra:#B5654A;         /* action accent, used sparingly */
  --terra-deep:#9C5138;
  --terra-soft:#F3E4DC;

  --ink:#33302B;           /* charcoal */
  --ink-2:#5E594F;
  --muted:#938C7E;
  --muted-2:#B4AC9C;

  --ok:#6C7059;
  --warn:#B5654A;

  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px;
  --sh-1:0 1px 2px rgba(51,48,43,.04), 0 1px 3px rgba(51,48,43,.05);
  --sh-2:0 4px 14px rgba(51,48,43,.07), 0 1px 3px rgba(51,48,43,.05);
  --sh-3:0 18px 48px rgba(51,48,43,.16), 0 4px 12px rgba(51,48,43,.08);
  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink);}
::selection{background:var(--olive-soft);}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:500;letter-spacing:-.02em;}

/* scrollbar */
*::-webkit-scrollbar{width:10px;height:10px;}
*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;border:3px solid transparent;background-clip:content-box;}
*::-webkit-scrollbar-track{background:transparent;}

/* ============================================================
   APP SHELL
============================================================ */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex:0 0 236px;
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:22px 16px;
  display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px;}
.brand-mark{
  width:30px;height:30px;border-radius:9px;flex:0 0 30px;
  background:linear-gradient(150deg,var(--olive),var(--olive-deep));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;
  box-shadow:var(--sh-1);
}
.brand-name{font-weight:600;font-size:15px;letter-spacing:-.02em;}
.brand-sub{font-size:11px;color:var(--muted);margin-top:-2px;}
.nav-label{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);padding:14px 12px 6px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;border-radius:10px;
  color:var(--ink-2);font-weight:500;font-size:13.5px;
  transition:background .16s var(--ease),color .16s var(--ease);
  text-align:left;width:100%;
}
.nav-item:hover{background:var(--surface-2);color:var(--ink);}
.nav-item.active{background:var(--olive-soft);color:var(--olive-deep);font-weight:600;}
.nav-item .ic{width:17px;height:17px;flex:0 0 17px;opacity:.85;}
.nav-item.active .ic{opacity:1;}
.sidebar-foot{margin-top:auto;padding:10px 12px;font-size:11px;color:var(--muted-2);}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:60px;flex:0 0 60px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 30px;background:var(--bg);
  position:sticky;top:0;z-index:20;
}
.topbar .ttl{font-weight:600;font-size:16px;letter-spacing:-.02em;}
.menu-btn{display:none;}
.nav-backdrop{display:none;}
.spacer{flex:1;}
.content{padding:30px;max-width:1240px;width:100%;margin:0 auto;}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:10px;font-weight:550;font-size:13px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);
  transition:all .15s var(--ease);white-space:nowrap;
}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--olive);color:#fff;border-color:var(--olive);}
.btn-primary:hover{background:var(--olive-deep);}
.btn-terra{background:var(--terra);color:#fff;border-color:var(--terra);}
.btn-terra:hover{background:var(--terra-deep);}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px;}
.btn .ic{width:15px;height:15px;}

.input,.select,.textarea{
  width:100%;padding:9px 12px;border:1px solid var(--border-strong);
  border-radius:10px;background:var(--surface);transition:border .15s,box-shadow .15s;
}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px var(--olive-soft);}
.textarea{resize:vertical;min-height:64px;line-height:1.55;}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px;letter-spacing:.01em;}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.01em;}
.pill-olive{background:var(--olive-soft);color:var(--olive-deep);}
.pill-terra{background:var(--terra-soft);color:var(--terra-deep);}
.pill-gray{background:var(--surface-2);color:var(--ink-2);}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}

/* ============================================================
   DASHBOARD
============================================================ */
.greet{font-size:32px;line-height:1.1;margin-bottom:4px;}
.greet-sub{color:var(--muted);font-size:14px;margin-bottom:26px;}
.dash-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;align-items:start;}
.dash-col{display:flex;flex-direction:column;gap:20px;}
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-hd h3{font-size:14px;}
.today-card{padding:22px 24px;}
.today-lesson{display:flex;flex-direction:column;gap:16px;}
.tl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.tl-title{font-size:19px;font-weight:600;letter-spacing:-.02em;}
.tl-obj{color:var(--ink-2);font-size:13.5px;line-height:1.55;}
.tl-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:2px;}
.quick-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.divider{height:1px;background:var(--border);margin:2px 0;}
.mini-list{display:flex;flex-direction:column;}
.mini-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.mini-row:last-child{border-bottom:none;}
.mini-row .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;}
.mini-row .t{font-weight:550;font-size:13px;}
.mini-row .s{font-size:12px;color:var(--muted);margin-left:auto;}
.stat{display:flex;align-items:baseline;gap:8px;}
.stat .n{font-size:26px;font-weight:650;letter-spacing:-.02em;}
.stat .l{font-size:12px;color:var(--muted);}
.progress-track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:10px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--olive),var(--olive-deep));border-radius:999px;transition:width .5s var(--ease);}
.week-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:4px;}
.week-day{border:1px solid var(--border);border-radius:12px;padding:10px;min-height:74px;background:var(--surface);}
.week-day.is-today{border-color:var(--olive);box-shadow:0 0 0 3px var(--olive-soft);}
.week-day .wd{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
.week-day .wn{font-size:15px;font-weight:600;margin-bottom:6px;}
.week-chip{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;margin-bottom:3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ============================================================
   PLANNER
============================================================ */
.planner-bar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.month-title{font-size:22px;font-weight:600;letter-spacing:-.02em;min-width:210px;}
.nav-btns{display:flex;gap:6px;}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;transition:background .15s;}
.icon-btn:hover{background:var(--surface-2);}
.legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--muted);margin-left:auto;}
.legend .li{display:flex;align-items:center;gap:6px;}

.cal{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);box-shadow:var(--sh-1);}
.cal-head{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface-2);border-bottom:1px solid var(--border);}
.cal-head div{padding:10px 14px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.cal-grid{display:grid;grid-template-columns:repeat(5,1fr);}
.cell{min-height:150px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px;position:relative;transition:background .15s;}
.cell:nth-child(5n){border-right:none;}
.cell.out{background:#FBF9F4;}
.cell.closed{background:repeating-linear-gradient(135deg,#F5F1E9,#F5F1E9 9px,#F1ECE2 9px,#F1ECE2 18px);}
.cell.drop{background:var(--olive-soft);box-shadow:inset 0 0 0 2px var(--olive);}
.cell-date{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.cell-num{font-size:12.5px;font-weight:600;color:var(--ink-2);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:8px;}
.cell.today .cell-num{background:var(--olive);color:#fff;}
.cell-tag{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.lcard{
  border-radius:10px;padding:7px 9px;margin-bottom:6px;cursor:grab;
  border:1px solid var(--border);background:var(--surface);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease);
}
.lcard:hover{box-shadow:var(--sh-2);transform:translateY(-1px);}
.lcard:active{cursor:grabbing;}
.lcard.math{border-left:3px solid var(--olive);}
.lcard.science{border-left:3px solid var(--terra);}
.lcard .lc-top{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
.lc-sub{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.lc-sub.math{color:var(--olive-deep);}
.lc-sub.science{color:var(--terra-deep);}
.lc-num{font-size:9.5px;color:var(--muted);font-weight:600;margin-left:auto;}
.lc-title{font-size:12px;font-weight:550;line-height:1.3;color:var(--ink);}
.lc-flag{margin-left:4px;}
.free-slot{font-size:11px;color:var(--muted-2);text-align:center;padding:6px;border:1px dashed var(--border-strong);border-radius:9px;}

/* ============================================================
   LESSON BANK
============================================================ */
.bank-top{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:240px;}
.search-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);}
.search{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border-strong);border-radius:11px;background:var(--surface);}
.search:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px var(--olive-soft);}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.fchip{padding:6px 12px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);font-size:12.5px;font-weight:550;color:var(--ink-2);transition:all .15s;}
.fchip:hover{background:var(--surface-2);}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.bank-list{display:flex;flex-direction:column;gap:10px;}
.bank-row{
  display:flex;align-items:center;gap:16px;padding:15px 18px;
  border:1px solid var(--border);border-radius:14px;background:var(--surface);
  box-shadow:var(--sh-1);transition:box-shadow .15s var(--ease),transform .12s var(--ease);cursor:pointer;
}
.bank-row:hover{box-shadow:var(--sh-2);transform:translateY(-1px);}
.br-badge{width:44px;height:44px;border-radius:12px;flex:0 0 44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;}
.br-badge.math{background:var(--olive-soft);color:var(--olive-deep);}
.br-badge.science{background:var(--terra-soft);color:var(--terra-deep);}
.br-badge .n{font-size:15px;line-height:1;}
.br-badge .m{font-size:8.5px;letter-spacing:.04em;margin-top:1px;}
.br-main{min-width:0;flex:1;}
.br-title{font-weight:600;font-size:14.5px;letter-spacing:-.01em;margin-bottom:2px;}
.br-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
.br-tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}

/* ============================================================
   SIDE PANEL (lesson detail)
============================================================ */
.overlay{position:fixed;inset:0;background:rgba(51,48,43,.28);backdrop-filter:blur(2px);z-index:40;opacity:0;animation:fade .2s var(--ease) forwards;}
@keyframes fade{to{opacity:1;}}
.panel{
  position:fixed;top:0;right:0;height:100vh;width:min(560px,94vw);
  background:var(--surface);z-index:50;box-shadow:var(--sh-3);
  display:flex;flex-direction:column;transform:translateX(100%);animation:slidein .28s var(--ease) forwards;
}
@keyframes slidein{to{transform:translateX(0);}}
.panel-head{padding:22px 26px 16px;border-bottom:1px solid var(--border);}
.panel-body{padding:8px 26px 40px;overflow-y:auto;flex:1;}
.panel-close{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s;}
.panel-close:hover{background:var(--surface-2);color:var(--ink);}
.p-sec{padding:18px 0;border-bottom:1px solid var(--border);}
.p-sec:last-child{border-bottom:none;}
.p-sec-t{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.p-body{font-size:13.5px;line-height:1.6;color:var(--ink-2);}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.reslink{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--border);border-radius:11px;margin-bottom:7px;color:var(--ink);font-size:13px;font-weight:500;transition:all .15s;background:var(--surface);}
.reslink:hover{border-color:var(--olive);background:var(--olive-soft);}
.reslink .ic{width:16px;height:16px;color:var(--olive);flex:0 0 16px;}
.reslink .ex{margin-left:auto;color:var(--muted);width:14px;height:14px;}
.check-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13.5px;}
.check-box{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--border-strong);flex:0 0 19px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.check-box.on{background:var(--olive);border-color:var(--olive);color:#fff;}

/* ============================================================
   MODAL (forms & dialogs)
============================================================ */
.modal-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;background:rgba(51,48,43,.32);backdrop-filter:blur(2px);animation:fade .18s var(--ease) forwards;}
.modal{width:min(720px,100%);background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-3);animation:pop .24s var(--ease);}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985);}to{opacity:1;transform:none;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 26px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;z-index:2;}
.modal-body{padding:24px 26px;}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:18px 26px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface);border-radius:0 0 var(--r-xl) var(--r-xl);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.fgroup{margin-bottom:18px;}
.form-sec-t{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--olive-deep);margin:26px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.form-sec-t:first-child{margin-top:0;}
.linkrow{display:flex;gap:8px;margin-bottom:8px;}
.linkrow .input{flex:1;}
.mini-x{width:36px;flex:0 0 36px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;}
.mini-x:hover{background:var(--terra-soft);color:var(--terra-deep);border-color:var(--terra);}
.add-link{font-size:12.5px;font-weight:600;color:var(--olive-deep);display:inline-flex;align-items:center;gap:5px;padding:4px 0;}

/* diff / preview */
.diff-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.diff-row:last-child{border-bottom:none;}
.diff-arrow{color:var(--muted);}
.diff-from{color:var(--muted);text-decoration:line-through;}
.diff-to{color:var(--olive-deep);font-weight:600;}

/* empty states */
.empty{text-align:center;padding:70px 24px;max-width:440px;margin:40px auto;}
.empty-ic{width:56px;height:56px;border-radius:16px;background:var(--olive-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:var(--olive-deep);}
.empty h3{font-size:18px;margin-bottom:8px;}
.empty p{color:var(--muted);font-size:13.5px;line-height:1.6;margin-bottom:20px;}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:var(--sh-3);z-index:80;display:flex;align-items:center;gap:12px;animation:pop .24s var(--ease);}
.toast button{color:var(--terra-soft);font-weight:600;}

@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;height:100vh;z-index:60;transform:translateX(-100%);transition:transform .26s var(--ease);width:264px;flex-basis:264px;}
  .sidebar.open{transform:translateX(0);box-shadow:var(--sh-3);}
  .nav-backdrop{display:block;position:fixed;inset:0;background:rgba(51,48,43,.32);backdrop-filter:blur(1px);z-index:55;animation:fade .2s var(--ease) forwards;}
  .menu-btn{display:flex !important;}

/* ============================================================

/* ============================================================
   1. CONSTANTS
============================================================ */
const SUBJECTS = ["Math","Science","First Days of School"];
const SUBJECT_COLORS = {
  "Math":{accent:"var(--olive)",deep:"var(--olive-deep)",soft:"var(--olive-soft)"},
  "Science":{accent:"var(--terra)",deep:"var(--terra-deep)",soft:"var(--terra-soft)"},
  "First Days of School":{accent:"#5E7684",deep:"#3F535E",soft:"#E7ECEF"},
};

const LANGS = ["English","Spanish","Bilingual"];
const LTYPES = ["Lesson","Review","Assessment","Flex"];
const SPECIAL = [
  {v:"holiday",label:"Holiday"},
  {v:"teacherWorkDay",label:"Teacher Work Day"},
  {v:"conferenceDay",label:"Conference Day"},
  {v:"pdDay",label:"Professional Development"},
  {v:"halfDay",label:"Half Day"},
  {v:"noInstruction",label:"No Instruction"},
];
const WEEKDAYS = ["Mon","Tue","Wed","Thu","Fri"];

/* ============================================================
   2. DATE HELPERS  (string YYYY-MM-DD, local, TZ-safe)
============================================================ */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const dow=s=>parse(s).getDay();               // 0 Sun … 6 Sat
const isWeekday=s=>{const d=dow(s);return d>=1&&d<=5;};
const todayISO=()=>iso(new Date());
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const pretty=s=>{if(!s)return"";const d=parse(s);return`${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]}, ${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`;};
const prettyLong=s=>{if(!s)return"";const d=parse(s);return`${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;};
const eachDate=(start,end)=>{const out=[];let c=start;while(c<=end){out.push(c);c=addDays(c,1);}return out;};

  attendance:{},  // dateISO -> studentId -> 'present'|'absent'|'tardy'|'excused'

};

function loadLocal(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw)return{...EMPTY_STATE,...JSON.parse(raw)};}catch(e){}

}

// Firebase (optional, guarded) — config can come from the block above OR be

let fbDoc=null,fbAuth=null,fbEnabled=false;

const EFFECTIVE_CONFIG=(FIREBASE_CONFIG&&FIREBASE_CONFIG.projectId)?FIREBASE_CONFIG:(storedConfig()||{});
const CLOUD=!!EFFECTIVE_CONFIG.projectId;
function parseConfig(text){
  const s=text.indexOf("{"),e=text.lastIndexOf("}");
  if(s<0||e<0)throw new Error("Paste the whole { … } config from Firebase.");
  let obj;try{obj=new Function("return ("+text.slice(s,e+1)+")")();}catch(_){throw new Error("That doesn’t look like a valid config — copy it straight from Firebase.");}
  if(!obj||!obj.projectId||!obj.apiKey)throw new Error("This config is missing apiKey / projectId.");
  return obj;
}
function initFirebase(){
  if(!CLOUD||typeof firebase==="undefined")return false;
  try{
    if(!firebase.apps.length)firebase.initializeApp(EFFECTIVE_CONFIG);
    fbDoc=firebase.firestore().collection(SYNC_COLLECTION).doc(SYNC_DOC);
    fbAuth=firebase.auth();
    fbEnabled=true;return true;
  }catch(e){console.warn("Firebase init failed, using local storage.",e);return false;}
}

/* ============================================================
   4. SCHEDULE ENGINE  (the core: dateless curriculum → dates)
============================================================ */
function seqOf(lessons,subject){
  return lessons.filter(l=>l.subject===subject)
    .sort((a,b)=>(a.quarter-b.quarter)||(a.module-b.module)||(a.lessonNumber-b.lessonNumber)||a.title.localeCompare(b.title));
}
function closureSet(sy,canceled){
  const set=new Set();
  (sy.specialDays||[]).forEach(d=>{if(d.type!=="halfDay")set.add(d.date);});
  (sy.testingWindows||[]).forEach(w=>{if(w.start&&w.end)eachDate(w.start,w.end).forEach(x=>set.add(x));});
  (canceled||[]).forEach(c=>set.add(c.date));
  return set;
}
function halfDaySet(sy){const s=new Set();(sy.specialDays||[]).forEach(d=>{if(d.type==="halfDay")s.add(d.date);});return s;}

function computeSchedule(state){
  const sy=state.schoolYear;
  const out={bySubjectDate:{},byDate:{},instructional:[],overflow:{},quarterEnds:[]};
  if(!sy.firstDay||!sy.lastDay||sy.firstDay>sy.lastDay)return out;
  const closed=closureSet(sy,state.canceled);
  const instructional=eachDate(sy.firstDay,sy.lastDay).filter(d=>isWeekday(d)&&!closed.has(d));
  out.instructional=instructional;

  // quarter boundaries: use provided or split instructional days in 4
  let qEnds=sy.quarterEnds&&sy.quarterEnds.length===4?[...sy.quarterEnds]:null;
  if(!qEnds){qEnds=[];const per=Math.ceil(instructional.length/4);for(let q=1;q<=4;q++){const idx=Math.min(q*per-1,instructional.length-1);qEnds.push(instructional[idx]||sy.lastDay);}}
  out.quarterEnds=qEnds;

  SUBJECTS.forEach(sub=>{
    const pins=state.pins[sub]||{};
    const pinnedIds=new Set(Object.entries(pins).filter(([d])=>instructional.includes(d)).map(([,id])=>id));
    const autos=seqOf(state.lessons,sub).filter(l=>!pinnedIds.has(l.id));
    const map={};let ai=0;
    instructional.forEach(date=>{
      if(pins[date]){map[date]=pins[date];}
      else if(ai<autos.length){map[date]=autos[ai].id;ai++;}
    });
    out.bySubjectDate[sub]=map;
    out.overflow[sub]=autos.slice(ai).map(l=>l.id);
    Object.entries(map).forEach(([date,lid])=>{
      out.byDate[date]=out.byDate[date]||{};out.byDate[date][sub]=lid;
    });
  });
  return out;
}
function quarterOfDate(date,qEnds){
  if(!qEnds.length)return null;
  for(let i=0;i<4;i++){if(date<=qEnds[i])return i+1;}
  return 4;
}

/* ============================================================
   6. SMALL SHARED COMPONENTS
============================================================ */
function LinkList({items,onChange,placeholder}){
  const list=items&&items.length?items:[];
  const set=(i,k,v)=>{const c=list.map(x=>({...x}));c[i][k]=v;onChange(c);};
  const add=()=>onChange([...list,{label:"",url:""}]);
  const del=i=>onChange(list.filter((_,x)=>x!==i));
  return(<div>
    {list.map((it,i)=>(<div className="linkrow" key={i}>
      <input className="input" style={{flex:"0 0 34%"}} placeholder="Label" value={it.label||""} onChange={e=>set(i,"label",e.target.value)}/>
      <input className="input" placeholder={placeholder||"https://…"} value={it.url||""} onChange={e=>set(i,"url",e.target.value)}/>
      <button className="mini-x" onClick={()=>del(i)} title="Remove"><I d={ic.x} s={14}/></button>
    </div>))}
    <button className="add-link" onClick={add}><I d={ic.plus} s={13}/> Add link</button>
  </div>);
}
function TagInput({value,onChange,placeholder}){
  const arr=value||[];const [t,setT]=useState("");
  const commit=()=>{const v=t.trim();if(v&&!arr.includes(v)){onChange([...arr,v]);}setT("");};
  return(<div>
    <div className="chips" style={{marginBottom:arr.length?8:0}}>
      {arr.map((x,i)=>(<span className="pill pill-gray" key={i}>{x}
        <button onClick={()=>onChange(arr.filter((_,j)=>j!==i))} style={{marginLeft:2,display:"flex"}}><I d={ic.x} s={11}/></button></span>))}
    </div>
    <input className="input" placeholder={placeholder||"Type and press Enter"} value={t}
      onChange={e=>setT(e.target.value)}
      onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();commit();}if(e.key===","){e.preventDefault();commit();}}}
      onBlur={commit}/>
  </div>);
}
function Field({label,children,hint,full}){
  return(<div className="fgroup" style={full?{gridColumn:"1 / -1"}:null}>
    {label&&<label className="fl">{label}</label>}{children}{hint&&<div className="hint">{hint}</div>}
  </div>);
}

/* ============================================================
   9. DASHBOARD
============================================================ */
function Dashboard({state,sched,onOpen,go}){
  const t=todayISO();
  const hour=new Date().getHours();
  const greet=hour<12?"Good morning":hour<17?"Good afternoon":"Good evening";
  const lessonById=id=>state.lessons.find(l=>l.id===id);
  const forDate=d=>{const row=sched.byDate[d]||{};return SUBJECTS.map(s=>({subject:s,lesson:row[s]?lessonById(row[s]):null}));};
  const qNow=quarterOfDate(t,sched.quarterEnds);
  const todays=forDate(t);
  const tomorrow=(()=>{let d=addDays(t,1);let guard=0;while(!sched.instructional.includes(d)&&guard<14){d=addDays(d,1);guard++;}return d;})();

  // week strip (Mon–Fri of current week)
  const monday=(()=>{let d=t;while(dow(d)!==1){d=addDays(d,-1);}return d;})();
  const week=[0,1,2,3,4].map(i=>addDays(monday,i));

  // upcoming assessments (next 30 instructional slots)
  const upcoming=[];
  sched.instructional.filter(d=>d>=t).slice(0,45).forEach(d=>{
    const row=sched.byDate[d]||{};SUBJECTS.forEach(s=>{const l=row[s]&&lessonById(row[s]);if(l&&l.type==="Assessment")upcoming.push({date:d,l});});
  });

  // monthly progress
  const monthDays=sched.instructional.filter(d=>d.slice(0,7)===t.slice(0,7));
  const passed=monthDays.filter(d=>d<=t).length;
  const pct=monthDays.length?Math.round(passed/monthDays.length*100):0;

  const hasYear=!!state.schoolYear.firstDay;

  if(!hasYear&&!state.lessons.length){
    return(<div className="content"><FirstRun go={go}/></div>);
  }

  return(<div className="content">
    <div style={{marginBottom:26}}>
      <h1 className="serif greet">{greet}, Mrs. Nava.</h1>
      <div className="greet-sub">{prettyLong(t)}{qNow?` · Quarter ${qNow}`:""}{todays.find(x=>x.lesson)?` · Module ${todays.find(x=>x.lesson).lesson.module}`:""}</div>
    </div>

    <div className="dash-grid">
      <div className="dash-col">
        {SUBJECTS.filter(sub=>{const it=todays.find(x=>x.subject===sub);return (it&&it.lesson)||sub==="Math"||sub==="Science";}).map(sub=>{
          const item=todays.find(x=>x.subject===sub);const l=item.lesson;
          return(<div className="card today-card" key={sub}>
            <div className="tl-head" style={{marginBottom:12}}>
              <span className="pill" style={{background:subMeta(sub).soft,color:subMeta(sub).deep}}>{sub}</span>
              <span className="eyebrow">Today</span>
            </div>
            {l?(<div className="today-lesson">
              <div>
                <div className="tl-title">{l.title}</div>
                <div className="tl-meta"><span>Q{l.quarter} · Mod {l.module} · L{l.lessonNumber}</span><span>{l.language}</span><span style={{display:"flex",alignItems:"center",gap:5}}><I d={ic.clock} s={13}/>{l.duration} min</span></div>
              </div>
              {l.objective&&<div className="tl-obj">{l.objective}</div>}
              {!!(l.materials||[]).length&&<div style={{fontSize:12.5,color:"var(--muted)"}}><b style={{color:"var(--ink-2)",fontWeight:600}}>Materials:</b> {l.materials.join(" · ")}</div>}
              <div className="quick-row">
                <button className="btn btn-sm btn-primary" onClick={()=>onOpen(l.id,t)}><I d={ic.book} s={14}/> Open lesson</button>
                {(l.slides||[]).filter(x=>x.url)[0]&&<a className="btn btn-sm" href={l.slides.filter(x=>x.url)[0].url} target="_blank" rel="noopener"><I d={ic.slides} s={14}/> Slides</a>}
                {(l.worksheets||[]).filter(x=>x.url)[0]&&<a className="btn btn-sm" href={l.worksheets.filter(x=>x.url)[0].url} target="_blank" rel="noopener"><I d={ic.file} s={14}/> Worksheet</a>}
                {(l.exitTicket||[]).filter(x=>x.url)[0]&&<a className="btn btn-sm" href={l.exitTicket.filter(x=>x.url)[0].url} target="_blank" rel="noopener">Exit ticket</a>}
                {l.driveFolder&&<a className="btn btn-sm" href={l.driveFolder} target="_blank" rel="noopener"><I d={ic.drive} s={14}/> Drive</a>}
              </div>
            </div>):(
              <div style={{color:"var(--muted)",fontSize:13.5,padding:"6px 0"}}>No {sub} lesson scheduled today.{!hasYear&&" Set up your school year to auto-fill lessons."}</div>
            )}
          </div>);
        })}

        <div className="card" style={{padding:"20px 24px"}}>
          <div className="section-hd"><h3>This week</h3><button className="btn btn-ghost btn-sm" onClick={()=>go("planner")}>Open planner</button></div>
          <div className="week-strip">
            {week.map((d,i)=>{const row=sched.byDate[d]||{};const closed=closureSet(state.schoolYear,state.canceled).has(d);
              return(<div className={"week-day"+(d===t?" is-today":"")} key={i}>
                <div className="wd">{WEEKDAYS[i]}</div><div className="wn">{parse(d).getDate()}</div>
                {closed?<span className="week-chip" style={{background:"var(--surface-2)",color:"var(--muted)"}}>Closed</span>:
                  SUBJECTS.map(s=>{const l=row[s]&&lessonById(row[s]);if(!l)return null;
                    return<span className="week-chip" key={s} style={{background:subMeta(s).soft,color:subMeta(s).deep}}>{l.title}</span>;})}
              </div>);})}
          </div>
        </div>
      </div>

      <div className="dash-col">
        <div className="card" style={{padding:"20px 24px"}}>
          <div className="section-hd"><h3>Monthly progress</h3></div>
          <div className="stat"><span className="n">{passed}<span style={{fontSize:15,color:"var(--muted)"}}>/{monthDays.length}</span></span><span className="l">instructional days done this month</span></div>
          <div className="progress-track"><div className="progress-fill" style={{width:pct+"%"}}/></div>
        </div>

        <div className="card" style={{padding:"20px 24px"}}>
          <div className="section-hd"><h3>Tomorrow</h3><span className="eyebrow">{pretty(tomorrow)}</span></div>
          <div className="mini-list">
            {SUBJECTS.filter(s=>{const row=sched.byDate[tomorrow]||{};return (row[s])||s==="Math"||s==="Science";}).map(s=>{const row=sched.byDate[tomorrow]||{};const l=row[s]&&lessonById(row[s]);
              return(<div className="mini-row" key={s}><span className="dot" style={{background:subMeta(s).accent}}/>
                <span className="t">{l?l.title:"—"}</span><span className="s">{s}</span></div>);})}
          </div>
        </div>

        <div className="card" style={{padding:"20px 24px"}}>
          <div className="section-hd"><h3>Upcoming assessments</h3></div>
          {upcoming.length?(<div className="mini-list">
            {upcoming.slice(0,5).map((u,i)=>(<div className="mini-row" key={i} onClick={()=>onOpen(u.l.id,u.date)} style={{cursor:"pointer"}}>
              <span className="dot" style={{background:"var(--terra)"}}/><span className="t">{u.l.title}</span><span className="s">{pretty(u.date)}</span></div>))}
          </div>):<div style={{color:"var(--muted)",fontSize:13,padding:"4px 0"}}>None scheduled ahead. Tag a lesson as “Assessment” to see it here.</div>}
        </div>

        <div className="card" style={{padding:"20px 24px"}}>
          <div className="section-hd"><h3>Jump in</h3></div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <button className="btn" onClick={()=>go("planner")}><I d={ic.cal} s={15}/> Plan this month</button>
            <button className="btn" onClick={()=>go("bank")}><I d={ic.bank} s={15}/> Open lesson bank</button>
          </div>
        </div>
      </div>
    </div>
  </div>);
}
function FirstRun({go}){
  return(<div style={{maxWidth:620,margin:"30px auto"}}>
    <h1 className="serif greet">Welcome, Mrs. Nava.</h1>
    <div className="greet-sub" style={{marginBottom:28}}>Two steps and every morning is ready for you. Your curriculum lives here permanently; only the calendar changes each year.</div>
    <div className="card" style={{padding:24,marginBottom:16,display:"flex",gap:18,alignItems:"center"}}>
