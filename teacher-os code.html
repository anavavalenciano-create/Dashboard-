<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Teacher OS</title>

     FONTS
============================================================ -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ============================================================
   DESIGN TOKENS
============================================================ */
:root{
  --bg:#FAF7F1;            /* warm white */
  --surface:#FFFFFF;
  --surface-2:#F1ECE3;     /* soft gray (warm) */
  --surface-3:#E9E3D8;
  --border:#E4DDD0;
  --border-strong:#D8CFBE;

  --olive:#6C7059;         /* primary accent */
  --olive-deep:#565A46;
  --olive-soft:#E9EBE2;

  --terra:#B5654A;         /* action accent, used sparingly */
  --terra-deep:#9C5138;
  --terra-soft:#F3E4DC;

  --ink:#33302B;           /* charcoal */
  --ink-2:#5E594F;
  --muted:#938C7E;
  --muted-2:#B4AC9C;

  --ok:#6C7059;
  --warn:#B5654A;

  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px;
  --sh-1:0 1px 2px rgba(51,48,43,.04), 0 1px 3px rgba(51,48,43,.05);
  --sh-2:0 4px 14px rgba(51,48,43,.07), 0 1px 3px rgba(51,48,43,.05);
  --sh-3:0 18px 48px rgba(51,48,43,.16), 0 4px 12px rgba(51,48,43,.08);
  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink);}
::selection{background:var(--olive-soft);}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:500;letter-spacing:-.02em;}

/* scrollbar */
*::-webkit-scrollbar{width:10px;height:10px;}
*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;border:3px solid transparent;background-clip:content-box;}
*::-webkit-scrollbar-track{background:transparent;}

/* ============================================================
   APP SHELL
============================================================ */
.app{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex:0 0 236px;
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:22px 16px;
  display:flex;flex-direction:column;gap:4px;
  position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 10px 20px;}
.brand-mark{
  width:30px;height:30px;border-radius:9px;flex:0 0 30px;
  background:linear-gradient(150deg,var(--olive),var(--olive-deep));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;
  box-shadow:var(--sh-1);
}
.brand-name{font-weight:600;font-size:15px;letter-spacing:-.02em;}
.brand-sub{font-size:11px;color:var(--muted);margin-top:-2px;}
.nav-label{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);padding:14px 12px 6px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;border-radius:10px;
  color:var(--ink-2);font-weight:500;font-size:13.5px;
  transition:background .16s var(--ease),color .16s var(--ease);
  text-align:left;width:100%;
}
.nav-item:hover{background:var(--surface-2);color:var(--ink);}
.nav-item.active{background:var(--olive-soft);color:var(--olive-deep);font-weight:600;}
.nav-item .ic{width:17px;height:17px;flex:0 0 17px;opacity:.85;}
.nav-item.active .ic{opacity:1;}
.sidebar-foot{margin-top:auto;padding:10px 12px;font-size:11px;color:var(--muted-2);}
.sync-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:60px;flex:0 0 60px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 30px;background:var(--bg);
  position:sticky;top:0;z-index:20;
}
.topbar .ttl{font-weight:600;font-size:16px;letter-spacing:-.02em;}
.menu-btn{display:none;}
.nav-backdrop{display:none;}
.spacer{flex:1;}
.content{padding:30px;max-width:1240px;width:100%;margin:0 auto;}

/* buttons */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:10px;font-weight:550;font-size:13px;
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);
  transition:all .15s var(--ease);white-space:nowrap;
}
.btn:hover{background:var(--surface-2);}
.btn-primary{background:var(--olive);color:#fff;border-color:var(--olive);}
.btn-primary:hover{background:var(--olive-deep);}
.btn-terra{background:var(--terra);color:#fff;border-color:var(--terra);}
.btn-terra:hover{background:var(--terra-deep);}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px;}
.btn .ic{width:15px;height:15px;}

.input,.select,.textarea{
  width:100%;padding:9px 12px;border:1px solid var(--border-strong);
  border-radius:10px;background:var(--surface);transition:border .15s,box-shadow .15s;
}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px var(--olive-soft);}
.textarea{resize:vertical;min-height:64px;line-height:1.55;}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px;letter-spacing:.01em;}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-1);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.01em;}
.pill-olive{background:var(--olive-soft);color:var(--olive-deep);}
.pill-terra{background:var(--terra-soft);color:var(--terra-deep);}
.pill-gray{background:var(--surface-2);color:var(--ink-2);}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}

/* ============================================================
   DASHBOARD
============================================================ */
.greet{font-size:32px;line-height:1.1;margin-bottom:4px;}
.greet-sub{color:var(--muted);font-size:14px;margin-bottom:26px;}
.dash-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:20px;align-items:start;}
.dash-col{display:flex;flex-direction:column;gap:20px;}
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-hd h3{font-size:14px;}
.today-card{padding:22px 24px;}
.today-lesson{display:flex;flex-direction:column;gap:16px;}
.tl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.tl-title{font-size:19px;font-weight:600;letter-spacing:-.02em;}
.tl-obj{color:var(--ink-2);font-size:13.5px;line-height:1.55;}
.tl-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:2px;}
.quick-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.divider{height:1px;background:var(--border);margin:2px 0;}
.mini-list{display:flex;flex-direction:column;}
.mini-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.mini-row:last-child{border-bottom:none;}
.mini-row .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;}
.mini-row .t{font-weight:550;font-size:13px;}
.mini-row .s{font-size:12px;color:var(--muted);margin-left:auto;}
.stat{display:flex;align-items:baseline;gap:8px;}
.stat .n{font-size:26px;font-weight:650;letter-spacing:-.02em;}
.stat .l{font-size:12px;color:var(--muted);}
.progress-track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:10px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--olive),var(--olive-deep));border-radius:999px;transition:width .5s var(--ease);}
.week-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:4px;}
.week-day{border:1px solid var(--border);border-radius:12px;padding:10px;min-height:74px;background:var(--surface);}
.week-day.is-today{border-color:var(--olive);box-shadow:0 0 0 3px var(--olive-soft);}
.week-day .wd{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
.week-day .wn{font-size:15px;font-weight:600;margin-bottom:6px;}
.week-chip{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;margin-bottom:3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ============================================================
   PLANNER
============================================================ */
.planner-bar{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.month-title{font-size:22px;font-weight:600;letter-spacing:-.02em;min-width:210px;}
.nav-btns{display:flex;gap:6px;}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;transition:background .15s;}
.icon-btn:hover{background:var(--surface-2);}
.legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--muted);margin-left:auto;}
.legend .li{display:flex;align-items:center;gap:6px;}

.cal{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);box-shadow:var(--sh-1);}
.cal-head{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface-2);border-bottom:1px solid var(--border);}
.cal-head div{padding:10px 14px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.cal-grid{display:grid;grid-template-columns:repeat(5,1fr);}
.cell{min-height:150px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px;position:relative;transition:background .15s;}
.cell:nth-child(5n){border-right:none;}
.cell.out{background:#FBF9F4;}
.cell.closed{background:repeating-linear-gradient(135deg,#F5F1E9,#F5F1E9 9px,#F1ECE2 9px,#F1ECE2 18px);}
.cell.drop{background:var(--olive-soft);box-shadow:inset 0 0 0 2px var(--olive);}
.cell-date{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.cell-num{font-size:12.5px;font-weight:600;color:var(--ink-2);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:8px;}
.cell.today .cell-num{background:var(--olive);color:#fff;}
.cell-tag{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
.lcard{
  border-radius:10px;padding:7px 9px;margin-bottom:6px;cursor:grab;
  border:1px solid var(--border);background:var(--surface);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease);
}
.lcard:hover{box-shadow:var(--sh-2);transform:translateY(-1px);}
.lcard:active{cursor:grabbing;}
.lcard.math{border-left:3px solid var(--olive);}
.lcard.science{border-left:3px solid var(--terra);}
.lcard .lc-top{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
.lc-sub{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;}
.lc-sub.math{color:var(--olive-deep);}
.lc-sub.science{color:var(--terra-deep);}
.lc-num{font-size:9.5px;color:var(--muted);font-weight:600;margin-left:auto;}
.lc-title{font-size:12px;font-weight:550;line-height:1.3;color:var(--ink);}
.lc-flag{margin-left:4px;}
.free-slot{font-size:11px;color:var(--muted-2);text-align:center;padding:6px;border:1px dashed var(--border-strong);border-radius:9px;}

/* ============================================================
   LESSON BANK
============================================================ */
.bank-top{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:240px;}
.search-wrap .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);}
.search{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border-strong);border-radius:11px;background:var(--surface);}
.search:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px var(--olive-soft);}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.fchip{padding:6px 12px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);font-size:12.5px;font-weight:550;color:var(--ink-2);transition:all .15s;}
.fchip:hover{background:var(--surface-2);}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.bank-list{display:flex;flex-direction:column;gap:10px;}
.bank-row{
  display:flex;align-items:center;gap:16px;padding:15px 18px;
  border:1px solid var(--border);border-radius:14px;background:var(--surface);
  box-shadow:var(--sh-1);transition:box-shadow .15s var(--ease),transform .12s var(--ease);cursor:pointer;
}
.bank-row:hover{box-shadow:var(--sh-2);transform:translateY(-1px);}
.br-badge{width:44px;height:44px;border-radius:12px;flex:0 0 44px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;}
.br-badge.math{background:var(--olive-soft);color:var(--olive-deep);}
.br-badge.science{background:var(--terra-soft);color:var(--terra-deep);}
.br-badge .n{font-size:15px;line-height:1;}
.br-badge .m{font-size:8.5px;letter-spacing:.04em;margin-top:1px;}
.br-main{min-width:0;flex:1;}
.br-title{font-weight:600;font-size:14.5px;letter-spacing:-.01em;margin-bottom:2px;}
.br-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
.br-tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;}

/* ============================================================
   SIDE PANEL (lesson detail)
============================================================ */
.overlay{position:fixed;inset:0;background:rgba(51,48,43,.28);backdrop-filter:blur(2px);z-index:40;opacity:0;animation:fade .2s var(--ease) forwards;}
@keyframes fade{to{opacity:1;}}
.panel{
  position:fixed;top:0;right:0;height:100vh;width:min(560px,94vw);
  background:var(--surface);z-index:50;box-shadow:var(--sh-3);
  display:flex;flex-direction:column;transform:translateX(100%);animation:slidein .28s var(--ease) forwards;
}
@keyframes slidein{to{transform:translateX(0);}}
.panel-head{padding:22px 26px 16px;border-bottom:1px solid var(--border);}
.panel-body{padding:8px 26px 40px;overflow-y:auto;flex:1;}
.panel-close{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s;}
.panel-close:hover{background:var(--surface-2);color:var(--ink);}
.p-sec{padding:18px 0;border-bottom:1px solid var(--border);}
.p-sec:last-child{border-bottom:none;}
.p-sec-t{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.p-body{font-size:13.5px;line-height:1.6;color:var(--ink-2);}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.reslink{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--border);border-radius:11px;margin-bottom:7px;color:var(--ink);font-size:13px;font-weight:500;transition:all .15s;background:var(--surface);}
.reslink:hover{border-color:var(--olive);background:var(--olive-soft);}
.reslink .ic{width:16px;height:16px;color:var(--olive);flex:0 0 16px;}
.reslink .ex{margin-left:auto;color:var(--muted);width:14px;height:14px;}
.check-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13.5px;}
.check-box{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--border-strong);flex:0 0 19px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.check-box.on{background:var(--olive);border-color:var(--olive);color:#fff;}

/* ============================================================
   MODAL (forms & dialogs)
============================================================ */
.modal-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;background:rgba(51,48,43,.32);backdrop-filter:blur(2px);animation:fade .18s var(--ease) forwards;}
.modal{width:min(720px,100%);background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--sh-3);animation:pop .24s var(--ease);}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985);}to{opacity:1;transform:none;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 26px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;z-index:2;}
.modal-body{padding:24px 26px;}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:18px 26px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface);border-radius:0 0 var(--r-xl) var(--r-xl);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.fgroup{margin-bottom:18px;}
.form-sec-t{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--olive-deep);margin:26px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.form-sec-t:first-child{margin-top:0;}
.linkrow{display:flex;gap:8px;margin-bottom:8px;}
.linkrow .input{flex:1;}
.mini-x{width:36px;flex:0 0 36px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;}
.mini-x:hover{background:var(--terra-soft);color:var(--terra-deep);border-color:var(--terra);}
.add-link{font-size:12.5px;font-weight:600;color:var(--olive-deep);display:inline-flex;align-items:center;gap:5px;padding:4px 0;}

/* diff / preview */
.diff-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
.diff-row:last-child{border-bottom:none;}
.diff-arrow{color:var(--muted);}
.diff-from{color:var(--muted);text-decoration:line-through;}
.diff-to{color:var(--olive-deep);font-weight:600;}

/* empty states */
.empty{text-align:center;padding:70px 24px;max-width:440px;margin:40px auto;}
.empty-ic{width:56px;height:56px;border-radius:16px;background:var(--olive-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:var(--olive-deep);}
.empty h3{font-size:18px;margin-bottom:8px;}
.empty p{color:var(--muted);font-size:13.5px;line-height:1.6;margin-bottom:20px;}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:500;box-shadow:var(--sh-3);z-index:80;display:flex;align-items:center;gap:12px;animation:pop .24s var(--ease);}
.toast button{color:var(--terra-soft);font-weight:600;}

@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;height:100vh;z-index:60;transform:translateX(-100%);transition:transform .26s var(--ease);width:264px;flex-basis:264px;}
  .sidebar.open{transform:translateX(0);box-shadow:var(--sh-3);}
  .nav-backdrop{display:block;position:fixed;inset:0;background:rgba(51,48,43,.32);backdrop-filter:blur(1px);z-index:55;animation:fade .2s var(--ease) forwards;}
  .menu-btn{display:flex !important;}

<body>

<script type="text/babel">
const {useState,useEffect,useMemo,useRef,useCallback} = React;

/* ============================================================
   0. FIREBASE CONFIG  — paste yours here to enable sync
   (Project Settings → Your apps → SDK setup and configuration)
============================================================ */
const FIREBASE_CONFIG = {
  // apiKey: "…",
  // authDomain: "nava-dashboard-4f966.firebaseapp.com",
  // projectId: "nava-dashboard-4f966",
  // ...
};
const SYNC_COLLECTION = "teacher-os";
const SYNC_DOC = "state-v1";

/* ============================================================
   1. CONSTANTS
============================================================ */
const SUBJECTS = ["Math","Science"];
const LANGS = ["English","Spanish","Bilingual"];
const LTYPES = ["Lesson","Review","Assessment","Flex"];
const SPECIAL = [
  {v:"holiday",label:"Holiday"},
  {v:"teacherWorkDay",label:"Teacher Work Day"},
  {v:"conferenceDay",label:"Conference Day"},
  {v:"pdDay",label:"Professional Development"},
  {v:"halfDay",label:"Half Day"},
  {v:"noInstruction",label:"No Instruction"},
];
const WEEKDAYS = ["Mon","Tue","Wed","Thu","Fri"];

/* ============================================================
   2. DATE HELPERS  (string YYYY-MM-DD, local, TZ-safe)
============================================================ */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const dow=s=>parse(s).getDay();               // 0 Sun … 6 Sat
const isWeekday=s=>{const d=dow(s);return d>=1&&d<=5;};
const todayISO=()=>iso(new Date());
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const pretty=s=>{if(!s)return"";const d=parse(s);return`${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]}, ${MONTHS[d.getMonth()].slice(0,3)} ${d.getDate()}`;};
const prettyLong=s=>{if(!s)return"";const d=parse(s);return`${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;};
const eachDate=(start,end)=>{const out=[];let c=start;while(c<=end){out.push(c);c=addDays(c,1);}return out;};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

/* ============================================================
   3. STATE + STORAGE
============================================================ */
const EMPTY_STATE={
  version:1,
  lessons:[],
  schoolYear:{name:"",firstDay:"",lastDay:"",specialDays:[],testingWindows:[],quarterEnds:[]},
  pins:{},        // subject -> {date: lessonId}
  canceled:[],    // [{date, reason}]
  prep:{},        // lessonId -> {itemIndex:bool}
  students:[],    // [{id,name,section,language,flag}]
  mastery:{},     // studentId -> {standard: level 0-4}
  reports:{},     // studentId -> {notes, goals}
};
const LS_KEY="teacher-os-state-v1";

function loadLocal(){
  try{const raw=localStorage.getItem(LS_KEY);if(raw)return{...EMPTY_STATE,...JSON.parse(raw)};}catch(e){}
  return null;
}
function saveLocal(s){try{localStorage.setItem(LS_KEY,JSON.stringify(s));}catch(e){}}

// Firebase (optional, guarded) — config can come from the block above OR be
// pasted into the in-app "Connect sync" screen (saved on the device).
let fbDoc=null,fbAuth=null,fbEnabled=false;
function storedConfig(){try{const raw=localStorage.getItem("teacher-os-fbconfig");if(raw)return JSON.parse(raw);}catch(e){}return null;}
const CONFIG_FROM_STORAGE=!(FIREBASE_CONFIG&&FIREBASE_CONFIG.projectId)&&!!storedConfig();
const EFFECTIVE_CONFIG=(FIREBASE_CONFIG&&FIREBASE_CONFIG.projectId)?FIREBASE_CONFIG:(storedConfig()||{});
const CLOUD=!!EFFECTIVE_CONFIG.projectId;
function parseConfig(text){
  const s=text.indexOf("{"),e=text.lastIndexOf("}");
  if(s<0||e<0)throw new Error("Paste the whole { … } config from Firebase.");
  let obj;try{obj=new Function("return ("+text.slice(s,e+1)+")")();}catch(_){throw new Error("That doesn’t look like a valid config — copy it straight from Firebase.");}
  if(!obj||!obj.projectId||!obj.apiKey)throw new Error("This config is missing apiKey / projectId.");
  return obj;
}
function initFirebase(){
  if(!CLOUD||typeof firebase==="undefined")return false;
  try{
    if(!firebase.apps.length)firebase.initializeApp(EFFECTIVE_CONFIG);
    fbDoc=firebase.firestore().collection(SYNC_COLLECTION).doc(SYNC_DOC);
    fbAuth=firebase.auth();
    fbEnabled=true;return true;
  }catch(e){console.warn("Firebase init failed, using local storage.",e);return false;}
}

/* ============================================================
   4. SCHEDULE ENGINE  (the core: dateless curriculum → dates)
============================================================ */
function seqOf(lessons,subject){
  return lessons.filter(l=>l.subject===subject)
    .sort((a,b)=>(a.quarter-b.quarter)||(a.module-b.module)||(a.lessonNumber-b.lessonNumber)||a.title.localeCompare(b.title));
}
function closureSet(sy,canceled){
  const set=new Set();
  (sy.specialDays||[]).forEach(d=>{if(d.type!=="halfDay")set.add(d.date);});
  (sy.testingWindows||[]).forEach(w=>{if(w.start&&w.end)eachDate(w.start,w.end).forEach(x=>set.add(x));});
  (canceled||[]).forEach(c=>set.add(c.date));
  return set;
}
function halfDaySet(sy){const s=new Set();(sy.specialDays||[]).forEach(d=>{if(d.type==="halfDay")s.add(d.date);});return s;}

function computeSchedule(state){
  const sy=state.schoolYear;
  const out={bySubjectDate:{},byDate:{},instructional:[],overflow:{},quarterEnds:[]};
  if(!sy.firstDay||!sy.lastDay||sy.firstDay>sy.lastDay)return out;
  const closed=closureSet(sy,state.canceled);
  const instructional=eachDate(sy.firstDay,sy.lastDay).filter(d=>isWeekday(d)&&!closed.has(d));
  out.instructional=instructional;

  // quarter boundaries: use provided or split instructional days in 4
  let qEnds=sy.quarterEnds&&sy.quarterEnds.length===4?[...sy.quarterEnds]:null;
  if(!qEnds){qEnds=[];const per=Math.ceil(instructional.length/4);for(let q=1;q<=4;q++){const idx=Math.min(q*per-1,instructional.length-1);qEnds.push(instructional[idx]||sy.lastDay);}}
  out.quarterEnds=qEnds;

  SUBJECTS.forEach(sub=>{
    const pins=state.pins[sub]||{};
    const pinnedIds=new Set(Object.entries(pins).filter(([d])=>instructional.includes(d)).map(([,id])=>id));
    const autos=seqOf(state.lessons,sub).filter(l=>!pinnedIds.has(l.id));
    const map={};let ai=0;
    instructional.forEach(date=>{
      if(pins[date]){map[date]=pins[date];}
      else if(ai<autos.length){map[date]=autos[ai].id;ai++;}
    });
    out.bySubjectDate[sub]=map;
    out.overflow[sub]=autos.slice(ai).map(l=>l.id);
    Object.entries(map).forEach(([date,lid])=>{
      out.byDate[date]=out.byDate[date]||{};out.byDate[date][sub]=lid;
    });
  });
  return out;
}
function quarterOfDate(date,qEnds){
  if(!qEnds.length)return null;
  for(let i=0;i<4;i++){if(date<=qEnds[i])return i+1;}
  return 4;
}

const M_LEVELS=[

/* ============================================================
   6. SMALL SHARED COMPONENTS
============================================================ */
function LinkList({items,onChange,placeholder}){
  const list=items&&items.length?items:[];
  const set=(i,k,v)=>{const c=list.map(x=>({...x}));c[i][k]=v;onChange(c);};
  const add=()=>onChange([...list,{label:"",url:""}]);
  const del=i=>onChange(list.filter((_,x)=>x!==i));
  return(<div>
    {list.map((it,i)=>(<div className="linkrow" key={i}>
      <input className="input" style={{flex:"0 0 34%"}} placeholder="Label" value={it.label||""} onChange={e=>set(i,"label",e.target.value)}/>
      <input className="input" placeholder={placeholder||"https://…"} value={it.url||""} onChange={e=>set(i,"url",e.target.value)}/>
      <button className="mini-x" onClick={()=>del(i)} title="Remove"><I d={ic.x} s={14}/></button>
    </div>))}
    <button className="add-link" onClick={add}><I d={ic.plus} s={13}/> Add link</button>
  </div>);
}
function TagInput({value,onChange,placeholder}){
  const arr=value||[];const [t,setT]=useState("");
  const commit=()=>{const v=t.trim();if(v&&!arr.includes(v)){onChange([...arr,v]);}setT("");};
  return(<div>
    <div className="chips" style={{marginBottom:arr.length?8:0}}>
      {arr.map((x,i)=>(<span className="pill pill-gray" key={i}>{x}
        <button onClick={()=>onChange(arr.filter((_,j)=>j!==i))} style={{marginLeft:2,display:"flex"}}><I d={ic.x} s={11}/></button></span>))}
    </div>
    <input className="input" placeholder={placeholder||"Type and press Enter"} value={t}
      onChange={e=>setT(e.target.value)}
      onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();commit();}if(e.key===","){e.preventDefault();commit();}}}
      onBlur={commit}/>
  </div>);
}
function Field({label,children,hint,full}){
  return(<div className="fgroup" style={full?{gridColumn:"1 / -1"}:null}>
    {label&&<label className="fl">{label}</label>}{children}{hint&&<div className="hint">{hint}</div>}

}

}

  const greet=hour<12?"Good morning":hour<17?"Good afternoon":"Good evening";
  const lessonById=id=>state.lessons.find(l=>l.id===id);
  const forDate=d=>{const row=sched.byDate[d]||{};return SUBJECTS.map(s=>({subject:s,lesson:row[s]?lessonById(row[s]):null}));};
  const qNow=quarterOfDate(t,sched.quarterEnds);
  const todays=forDate(t);
  const tomorrow=(()=>{let d=addDays(t,1);let guard=0;while(!sched.instructional.includes(d)&&guard<14){d=addDays(d,1);guard++;}return d;})();

  // week strip (Mon–Fri of current week)
  const monday=(()=>{let d=t;while(dow(d)!==1){d=addDays(d,-1);}return d;})();

  // upcoming assessments (next 30 instructional slots)
  const upcoming=[];

            </div>

              <div>
                <div className="tl-title">{l.title}</div>

              <div className="quick-row">

/* ============================================================
   10. PLANNER (month calendar, drag-to-move, move-forward)
============================================================ */
function Planner({state,sched,setState,onOpen,toast}){
  const t=todayISO();
  const [cursor,setCursor]=useState(t.slice(0,7)+"-01");
  const [drag,setDrag]=useState(null);       // {subject,fromDate}
  const [dropDate,setDropDate]=useState(null);
  const [moveOpen,setMoveOpen]=useState(false);
  const lessonById=id=>state.lessons.find(l=>l.id===id);
  const cY=parse(cursor).getFullYear(),cM=parse(cursor).getMonth();
  const hasYear=!!state.schoolYear.firstDay;

  if(!hasYear){return(<div className="content"><div className="empty">
    <div className="empty-ic"><I d={ic.cal} s={24}/></div>
    <h3>Your planner is waiting on a calendar</h3>
    <p>Set your first day, last day and holidays, and the month view fills itself with your lessons in order.</p>
    <button className="btn btn-primary" onClick={()=>toast.go&&toast.go("year")}>Set up school year</button>
  </div></div>);}

  // build weeks (Mon–Fri only)
  const first=new Date(cY,cM,1);
  let startMon=iso(first);while(dow(startMon)!==1)startMon=addDays(startMon,-1);
  const weeks=[];let d=startMon;
  for(let w=0;w<6;w++){const row=[];for(let i=0;i<5;i++){row.push(addDays(d,i));}weeks.push(row);d=addDays(d,7);
    if(parse(row[4]).getMonth()!==cM&&parse(row[0]).getMonth()!==cM&&w>=4)break;}
  const closed=closureSet(state.schoolYear,state.canceled);
  const halfs=halfDaySet(state.schoolYear);
  const specialType=dd=>{const s=(state.schoolYear.specialDays||[]).find(x=>x.date===dd);if(s)return SPECIAL.find(z=>z.v===s.type);const inTest=(state.schoolYear.testingWindows||[]).some(w=>w.start&&w.end&&dd>=w.start&&dd<=w.end);if(inTest)return{label:"Testing"};if((state.canceled||[]).some(c=>c.date===dd))return{label:"Canceled"};return null;};

  // drag to move = swap placements within a subject via pins
  const doDrop=(toDate)=>{
    if(!drag)return;
    const {subject,fromDate}=drag;
    if(toDate===fromDate){setDrag(null);setDropDate(null);return;}
    if(!sched.instructional.includes(toDate)){toast.show("That day isn’t an instructional day.");setDrag(null);setDropDate(null);return;}
    const fromId=sched.bySubjectDate[subject][fromDate];
    const toId=sched.bySubjectDate[subject][toDate];
    setState(p=>{
      const pins={...p.pins,[subject]:{...(p.pins[subject]||{})}};
      pins[subject][toDate]=fromId;
      if(toId)pins[subject][fromDate]=toId; else delete pins[subject][fromDate];
      return{...p,pins};
    });
    toast.show(`Moved to ${pretty(toDate)}`,"Undo",()=>{
      setState(p=>{const pins={...p.pins,[subject]:{...(p.pins[subject]||{})}};
        pins[subject][fromDate]=fromId;if(toId)pins[subject][toDate]=toId;else delete pins[subject][toDate];return{...p,pins};});
    });
    setDrag(null);setDropDate(null);
  };

  return(<div className="content">
    <div className="planner-bar">
      <div className="month-title">{MONTHS[cM]} {cY}</div>
      <div className="nav-btns">
        <button className="icon-btn" onClick={()=>setCursor(iso(new Date(cY,cM-1,1)))}><I d={ic.chevL}/></button>
        <button className="btn btn-sm" onClick={()=>setCursor(t.slice(0,7)+"-01")}>Today</button>
        <button className="icon-btn" onClick={()=>setCursor(iso(new Date(cY,cM+1,1)))}><I d={ic.chevR}/></button>
      </div>
      <button className="btn btn-terra btn-sm" onClick={()=>setMoveOpen(true)}><I d={ic.forward} s={14}/> Move lessons forward</button>
      <div className="legend">
        <span className="li"><span className="dot" style={{width:9,height:9,borderRadius:2,background:"var(--olive)"}}/> Math</span>
        <span className="li"><span className="dot" style={{width:9,height:9,borderRadius:2,background:"var(--terra)"}}/> Science</span>
      </div>
    </div>

    <div className="cal">
      <div className="cal-head">{WEEKDAYS.map(w=><div key={w}>{w}</div>)}</div>
      <div className="cal-grid">
        {weeks.flat().map((dd,idx)=>{
          const out=parse(dd).getMonth()!==cM;
          const isClosed=closed.has(dd);
          const sp=specialType(dd);
          const row=sched.byDate[dd]||{};
          return(<div key={idx}
            className={"cell"+(out?" out":"")+(isClosed?" closed":"")+(dd===t?" today":"")+(dropDate===dd?" drop":"")}
            onDragOver={e=>{if(drag){e.preventDefault();setDropDate(dd);}}}
            onDragLeave={()=>{if(dropDate===dd)setDropDate(null);}}
            onDrop={e=>{e.preventDefault();doDrop(dd);}}>
            <div className="cell-date">
              <span className="cell-num">{parse(dd).getDate()}</span>
              {sp&&<span className="cell-tag">{sp.label}{halfs.has(dd)?"":""}</span>}
              {halfs.has(dd)&&!sp&&<span className="cell-tag">Half day</span>}
            </div>
            {!isClosed&&SUBJECTS.map(sub=>{
              const l=row[sub]&&lessonById(row[sub]);if(!l)return null;
              const q=quarterOfDate(dd,sched.quarterEnds);
              const wrongQ=q&&l.quarter&&q!==l.quarter;
              return(<div key={sub} className={"lcard "+sub.toLowerCase()} draggable
                onDragStart={()=>setDrag({subject:sub,fromDate:dd})}
                onDragEnd={()=>{setDrag(null);setDropDate(null);}}
                onClick={()=>onOpen(l.id,dd)}>
                <div className="lc-top">
                  <span className={"lc-sub "+sub.toLowerCase()}>{sub}</span>
                  {l.type!=="Lesson"&&<span className="pill pill-gray" style={{fontSize:9,padding:"1px 6px"}}>{l.type}</span>}
                  {wrongQ&&<span title="Runs past this quarter" style={{color:"var(--terra)",display:"flex"}}><I d={ic.spark} s={12}/></span>}
                  <span className="lc-num">Q{l.quarter}·M{l.module}·L{l.lessonNumber}</span>
                </div>
                <div className="lc-title">{l.title}</div>
              </div>);
            })}
          </div>);
        })}
      </div>
    </div>

    {Object.values(sched.overflow).some(a=>a.length>0)&&(
      <div className="card" style={{marginTop:18,padding:"16px 20px",borderColor:"var(--terra)",background:"var(--terra-soft)"}}>
        <div style={{fontWeight:600,color:"var(--terra-deep)",marginBottom:4,fontSize:13}}>Some lessons don’t fit the school year yet</div>
        <div style={{fontSize:12.5,color:"var(--terra-deep)"}}>
          {SUBJECTS.map(s=>sched.overflow[s].length?`${sched.overflow[s].length} ${s} `:"").join("")}
          lesson(s) fall past the last day. Add instructional days or trim review to fit them in.
        </div>
      </div>
    )}

    {moveOpen&&<MoveForward state={state} sched={sched} setState={setState} onClose={()=>setMoveOpen(false)} toast={toast}/>}
  </div>);
}

/* ---- Move lessons forward (preview + undo) ---- */
function MoveForward({state,sched,setState,onClose,toast}){
  const t=todayISO();
  const futureInstr=sched.instructional.filter(d=>d>=t);
  const [date,setDate]=useState(futureInstr[0]||t);
  const [reason,setReason]=useState("Snow day");
  const lessonById=id=>state.lessons.find(l=>l.id===id);

  // preview: simulate adding this date as a closure
  const preview=useMemo(()=>{
    if(!sched.instructional.includes(date))return[];
    const sim={...state,canceled:[...state.canceled,{date,reason}]};
    const after=computeSchedule(sim);
    const rows=[];
    sched.instructional.filter(d=>d>=date).forEach(d=>{
      SUBJECTS.forEach(s=>{
        const b=(sched.byDate[d]||{})[s]||null;
        const a=(after.byDate[d]||{})[s]||null;
        if(b!==a)rows.push({date:d,subject:s,before:b,after:a});
      });
    });
    return rows;
  },[date,reason,state,sched]);

  const confirm=()=>{
    setState(p=>({...p,canceled:[...p.canceled,{date,reason}]}));
    onClose();
    toast.show(`${reason} added — lessons shifted forward`,"Undo",()=>{
      setState(p=>({...p,canceled:p.canceled.filter(c=>!(c.date===date&&c.reason===reason))}));
    });
  };
  const canDo=sched.instructional.includes(date);

  return(<div className="modal-wrap" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal" style={{maxWidth:560}}>
      <div className="modal-head">
        <div><div className="eyebrow" style={{marginBottom:2}}>Scheduler</div><h2 style={{fontSize:18}}>Move remaining lessons forward</h2></div>
        <button className="panel-close" style={{position:"static"}} onClick={onClose}><I d={ic.x}/></button>
      </div>
      <div className="modal-body">
        <p style={{color:"var(--muted)",fontSize:13,marginTop:0}}>Pick the day that got lost. Every lesson from that day on shifts to the next instructional day — curriculum order stays intact, and you can undo it.</p>
        <div className="grid2">
          <Field label="Lost day"><select className="select" value={date} onChange={e=>setDate(e.target.value)}>{futureInstr.slice(0,60).map(d=><option key={d} value={d}>{pretty(d)}</option>)}</select></Field>
          <Field label="Reason"><select className="select" value={reason} onChange={e=>setReason(e.target.value)}>{["Snow day","Assembly","Testing","Field trip","Unexpected event"].map(r=><option key={r}>{r}</option>)}</select></Field>
        </div>
        <div className="form-sec-t" style={{marginTop:8}}>Preview — {preview.length} placement{preview.length===1?"":"s"} change</div>
        {canDo?(preview.length?(<div style={{maxHeight:260,overflowY:"auto"}}>
          {preview.slice(0,40).map((r,i)=>{const l=r.after?lessonById(r.after):(r.before?lessonById(r.before):null);
            return(<div className="diff-row" key={i}>
              <span className="pill pill-gray" style={{fontSize:10}}>{r.subject[0]}</span>
              <span style={{flex:1,fontWeight:550}}>{l?l.title:"—"}</span>
              <span className="diff-from">{pretty(r.date)}</span>
              <span className="diff-arrow"><I d={ic.chevR} s={13}/></span>
              <span className="diff-to">{r.after?"next day":"shifts out"}</span>
            </div>);})}
        </div>):<div style={{color:"var(--muted)",fontSize:13}}>Nothing scheduled on or after this day yet.</div>)
        :<div style={{color:"var(--terra-deep)",fontSize:13}}>That day is already closed on your calendar.</div>}
      </div>
      <div className="modal-foot">
        <button className="btn" onClick={onClose}>Cancel</button>
        <button className="btn btn-terra" disabled={!canDo} style={!canDo?{opacity:.5}:null} onClick={confirm}>Shift lessons forward</button>
      </div>
    </div>
  </div>);
}

/* ============================================================
   11. LESSON BANK
============================================================ */
function Bank({state,sched,setState,onOpen,openNew,toast}){
  const [q,setQ]=useState("");
  const [fSub,setFSub]=useState("All");
  const [fQ,setFQ]=useState("All");
  const [fLang,setFLang]=useState("All");
  const [fType,setFType]=useState("All");

  const modules=useMemo(()=>{const m=new Set();state.lessons.forEach(l=>m.add(l.module));return[...m].sort((a,b)=>a-b);},[state.lessons]);

  const filtered=useMemo(()=>{
    const term=q.trim().toLowerCase();
    return seqAll(state.lessons).filter(l=>{
      if(fSub!=="All"&&l.subject!==fSub)return false;
      if(fQ!=="All"&&l.quarter!==+fQ)return false;
      if(fLang!=="All"&&l.language!==fLang)return false;
      if(fType!=="All"&&l.type!==fType)return false;
      if(!term)return true;
      const hay=[l.title,l.objective,l.teacherNotes,l.studentNotes,(l.standards||[]).join(" "),(l.vocabulary||[]).join(" "),(l.tags||[]).join(" "),(l.targets||[]).join(" "),`q${l.quarter} module ${l.module} lesson ${l.lessonNumber}`].join(" ").toLowerCase();
      return hay.includes(term);
    });
  },[state.lessons,q,fSub,fQ,fLang,fType]);

  // pacing per module (does last lesson land before its quarter end?)
  const pace=useMemo(()=>{const m={};SUBJECTS.forEach(sub=>{const map=sched.bySubjectDate[sub]||{};const dateOf={};Object.entries(map).forEach(([d,id])=>dateOf[id]=d);
    state.lessons.filter(l=>l.subject===sub).forEach(l=>{const key=sub+"-"+l.module;const d=dateOf[l.id];if(!d)return;const q=quarterOfDate(d,sched.quarterEnds);if(q&&q>l.quarter)m[key]="behind";else if(!(key in m))m[key]="ok";});});return m;},[state,sched]);

  const clearable=fSub!=="All"||fQ!=="All"||fLang!=="All"||fType!=="All"||q;

  return(<div className="content">
    <div className="bank-top">
      <div className="search-wrap"><I d={ic.search}/><input className="search" placeholder="Search lessons, objectives, standards, vocabulary, tags…" value={q} onChange={e=>setQ(e.target.value)}/></div>
      <button className="btn btn-primary" onClick={openNew}><I d={ic.plus} s={15}/> New lesson</button>
    </div>
    <div className="filters">
      <Seg label="Subject" v={fSub} set={setFSub} opts={["All",...SUBJECTS]}/>
      <Seg label="Quarter" v={fQ} set={setFQ} opts={["All","1","2","3","4"]} fmt={x=>x==="All"?"All quarters":"Q"+x}/>
      <Seg label="Type" v={fType} set={setFType} opts={["All",...LTYPES]}/>
      <Seg label="Language" v={fLang} set={setFLang} opts={["All",...LANGS]}/>
      {clearable&&<button className="fchip" onClick={()=>{setQ("");setFSub("All");setFQ("All");setFLang("All");setFType("All");}} style={{color:"var(--terra-deep)"}}>Clear</button>}
    </div>

    {!state.lessons.length?(<div className="empty">
      <div className="empty-ic"><I d={ic.bank} s={24}/></div>
      <h3>Your lesson bank is empty</h3>
      <p>Add each lesson once — objective, standards, worksheets, slides, Drive links, exit ticket. It fills your calendar automatically and never needs rebuilding, even when next year’s dates change.</p>
      <button className="btn btn-primary" onClick={openNew}><I d={ic.plus} s={15}/> Add your first lesson</button>
    </div>):filtered.length?(
      <div className="bank-list">
        {filtered.map(l=>{const behind=pace[l.subject+"-"+l.module]==="behind";
          return(<div className="bank-row" key={l.id} onClick={()=>onOpen(l.id)}>
            <div className={"br-badge "+l.subject.toLowerCase()}><span className="n">L{l.lessonNumber}</span><span className="m">MOD {l.module}</span></div>
            <div className="br-main">
              <div className="br-title">{l.title}</div>
              <div className="br-meta">
                <span>{l.subject}</span><span>Q{l.quarter}</span><span>{l.language}</span>
                {l.duration?<span>{l.duration} min</span>:null}
                {l.type!=="Lesson"&&<span className={"pill "+(l.type==="Assessment"?"pill-terra":"pill-gray")} style={{fontSize:10}}>{l.type}</span>}
                {behind&&<span className="pill pill-terra" style={{fontSize:10}}>Runs past Q{l.quarter}</span>}
              </div>
            </div>
            <div className="br-tags">
              {(l.standards||[]).slice(0,2).map((s,i)=><span key={i} className="pill pill-olive">{s}</span>)}
              {(l.tags||[]).slice(0,2).map((s,i)=><span key={"t"+i} className="pill pill-gray">{s}</span>)}
            </div>
          </div>);})}
      </div>
    ):(<div className="empty"><div className="empty-ic"><I d={ic.search} s={24}/></div><h3>No lessons match</h3><p>Try a different search or clear your filters.</p></div>)}
  </div>);
}
function seqAll(lessons){return[...lessons].sort((a,b)=>(a.subject.localeCompare(b.subject))||(a.quarter-b.quarter)||(a.module-b.module)||(a.lessonNumber-b.lessonNumber));}
function Seg({label,v,set,opts,fmt}){
  return(<div style={{display:"flex",gap:6}}>
    {opts.map(o=><button key={o} className={"fchip"+(v===o?" on":"")} onClick={()=>set(o)}>{fmt?fmt(o):(o==="All"?"All "+label.toLowerCase()+"s":o)}</button>)}
  </div>);
}

/* ============================================================
   12. SCHOOL YEAR EDITOR
============================================================ */
function SchoolYear({state,setState,toast}){
  const sy=state.schoolYear;
  const up=(k,v)=>setState(p=>({...p,schoolYear:{...p.schoolYear,[k]:v}}));
  const [spDate,setSpDate]=useState("");const [spType,setSpType]=useState("holiday");
  const [twS,setTwS]=useState("");const [twE,setTwE]=useState("");

  const addSpecial=()=>{if(!spDate)return;up("specialDays",[...(sy.specialDays||[]).filter(d=>d.date!==spDate),{date:spDate,type:spType}]);setSpDate("");};
  const rmSpecial=dd=>up("specialDays",(sy.specialDays||[]).filter(d=>d.date!==dd));
  const addTw=()=>{if(!twS||!twE||twS>twE)return;up("testingWindows",[...(sy.testingWindows||[]),{start:twS,end:twE}]);setTwS("");setTwE("");};
  const rmTw=i=>up("testingWindows",(sy.testingWindows||[]).filter((_,x)=>x!==i));

  const instrCount=(()=>{if(!sy.firstDay||!sy.lastDay)return 0;const s=computeSchedule(state);return s.instructional.length;})();
  const sorted=[...(sy.specialDays||[])].sort((a,b)=>a.date.localeCompare(b.date));

  const fileRef=useRef(null);
  const exportData=()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=`teacher-os-backup-${todayISO()}.json`;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
    toast.show("Backup downloaded");
  };
  const handleImport=e=>{
    const file=e.target.files&&e.target.files[0];if(!file){return;}
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(!data||typeof data!=="object"||!Array.isArray(data.lessons))throw new Error("shape");
        if(window.confirm("Import this backup? It replaces everything currently in the app on this device — and if you're synced, it updates your other devices too.")){
          setState({...EMPTY_STATE,...data});toast.show("Backup imported");
        }
      }catch(err){toast.show("That file isn’t a valid Teacher OS backup.");}
      e.target.value="";
    };
    reader.readAsText(file);
  };

  return(<div className="content" style={{maxWidth:820}}>
    <div style={{marginBottom:22}}>
      <h1 style={{fontSize:22}}>School year</h1>
      <div className="greet-sub" style={{margin:"4px 0 0"}}>The one thing you update each August. Change these dates and every lesson re-flows automatically — your curriculum never moves.</div>
    </div>

    <div className="card" style={{padding:24,marginBottom:18}}>
      <div className="form-sec-t" style={{marginTop:0}}>The essentials</div>
      <div className="grid3">
        <Field label="Year label"><input className="input" value={sy.name} onChange={e=>up("name",e.target.value)} placeholder="2025–26"/></Field>
        <Field label="First day"><input className="input" type="date" value={sy.firstDay} onChange={e=>up("firstDay",e.target.value)}/></Field>
        <Field label="Last day"><input className="input" type="date" value={sy.lastDay} onChange={e=>up("lastDay",e.target.value)}/></Field>
      </div>
      {sy.firstDay&&sy.lastDay&&<div className="pill pill-olive" style={{marginTop:4}}>{instrCount} instructional days (Mon–Fri, minus closures)</div>}
    </div>

    <div className="card" style={{padding:24,marginBottom:18}}>
      <div className="form-sec-t" style={{marginTop:0}}>Non-instructional & special days</div>
      <div className="linkrow" style={{marginBottom:14}}>
        <input className="input" type="date" style={{flex:"0 0 40%"}} value={spDate} onChange={e=>setSpDate(e.target.value)}/>
        <select className="select" value={spType} onChange={e=>setSpType(e.target.value)}>{SPECIAL.map(s=><option key={s.v} value={s.v}>{s.label}</option>)}</select>
        <button className="btn btn-primary" onClick={addSpecial}><I d={ic.plus} s={14}/> Add</button>
      </div>
      {sorted.length?(<div style={{display:"flex",flexDirection:"column",gap:6}}>
        {sorted.map(dd=>{const label=(SPECIAL.find(s=>s.v===dd.type)||{}).label;
          return(<div key={dd.date} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 12px",border:"1px solid var(--border)",borderRadius:10}}>
            <span style={{fontWeight:550,minWidth:150}}>{prettyLong(dd.date)}</span>
            <span className={"pill "+(dd.type==="halfDay"?"pill-gray":"pill-terra")}>{label}</span>
            <button className="mini-x" style={{marginLeft:"auto"}} onClick={()=>rmSpecial(dd.date)}><I d={ic.x} s={14}/></button>
          </div>);})}
      </div>):<div style={{color:"var(--muted)",fontSize:13}}>No days added yet. Half days stay instructional; everything else pauses lesson placement.</div>}
    </div>

    <div className="card" style={{padding:24}}>
      <div className="form-sec-t" style={{marginTop:0}}>Testing windows</div>
      <div className="linkrow" style={{marginBottom:14}}>
        <input className="input" type="date" value={twS} onChange={e=>setTwS(e.target.value)}/>
        <span style={{alignSelf:"center",color:"var(--muted)",fontSize:13}}>to</span>
        <input className="input" type="date" value={twE} onChange={e=>setTwE(e.target.value)}/>
        <button className="btn btn-primary" onClick={addTw}><I d={ic.plus} s={14}/> Add</button>
      </div>
      {(sy.testingWindows||[]).length?(<div style={{display:"flex",flexDirection:"column",gap:6}}>
        {sy.testingWindows.map((w,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"8px 12px",border:"1px solid var(--border)",borderRadius:10}}>
          <span style={{fontWeight:550}}>{pretty(w.start)} → {pretty(w.end)}</span>
          <span className="pill pill-terra">Testing — no new lessons</span>
          <button className="mini-x" style={{marginLeft:"auto"}} onClick={()=>rmTw(i)}><I d={ic.x} s={14}/></button>
        </div>))}
      </div>):<div style={{color:"var(--muted)",fontSize:13}}>No testing windows set. Lessons skip these days automatically.</div>}
    </div>

    <div className="card" style={{padding:24,marginTop:18}}>
      <div className="form-sec-t" style={{marginTop:0}}>Backup &amp; data</div>
      <p style={{fontSize:13,color:"var(--muted)",marginTop:0,lineHeight:1.6}}>Export a copy of everything — lessons, calendar, students, mastery, reports — as a file you keep. Use it as a safety backup, or to move data onto a new device before you’ve connected sync.</p>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <button className="btn btn-primary" onClick={exportData}><I d={ic.download} s={15}/> Export backup (.json)</button>
        <button className="btn" onClick={()=>fileRef.current&&fileRef.current.click()}><I d={ic.upload} s={15}/> Import backup…</button>
        <input ref={fileRef} type="file" accept="application/json,.json" style={{display:"none"}} onChange={handleImport}/>
      </div>
    </div>
  </div>);
}

/* ============================================================
   12b. STUDENTS & STANDARDS MASTERY  (phase-2 module)

function StudentsView({state,setState,toast,onReport}){
  const [tab,setTab]=useState("roster");
  const [section,setSection]=useState("All");
  const standards=useMemo(()=>[...new Set(state.lessons.flatMap(l=>l.standards||[]))].sort(),[state.lessons]);
  const sections=useMemo(()=>[...new Set(state.students.map(s=>s.section).filter(Boolean))].sort(),[state.students]);
  const roster=useMemo(()=>[...state.students].sort((a,b)=>(a.section||"").localeCompare(b.section||"")||a.name.localeCompare(b.name)),[state.students]);
  const inSection=s=>section==="All"||s.section===section;

  const addStudents=list=>setState(p=>({...p,students:[...p.students,...list.map(x=>({id:uid(),...x}))]}));
  const updStudent=(id,patch)=>setState(p=>({...p,students:p.students.map(s=>s.id===id?{...s,...patch}:s)}));
  const delStudent=id=>setState(p=>{const m={...p.mastery};delete m[id];return{...p,students:p.students.filter(s=>s.id!==id),mastery:m};});
  const cycleLevel=(sid,std)=>setState(p=>{const m={...p.mastery,[sid]:{...(p.mastery[sid]||{})}};m[sid][std]=((m[sid][std]||0)+1)%5;return{...p,mastery:m};});

  const TABS=[{k:"roster",label:"Roster",icon:ic.users},{k:"mastery",label:"Mastery grid",icon:ic.grid},{k:"snapshot",label:"Class snapshot",icon:ic.chart}];

  return(<div className="content">
    <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:20,flexWrap:"wrap"}}>
      <div><h1 style={{fontSize:22}}>Students &amp; mastery</h1>
        <div className="greet-sub" style={{margin:"3px 0 0"}}>{state.students.length} students · {standards.length} standards from your lesson bank</div></div>
      <div style={{marginLeft:"auto",display:"flex",gap:6,background:"var(--surface-2)",padding:4,borderRadius:12}}>
        {TABS.map(t=><button key={t.k} className={"btn btn-sm"+(tab===t.k?" btn-primary":" btn-ghost")} onClick={()=>setTab(t.k)}><I d={t.icon} s={14}/>{t.label}</button>)}
      </div>
    </div>

    {sections.length>0&&tab!=="roster"&&(<div className="filters" style={{marginBottom:18}}>
      <button className={"fchip"+(section==="All"?" on":"")} onClick={()=>setSection("All")}>All classes</button>
      {sections.map(s=><button key={s} className={"fchip"+(section===s?" on":"")} onClick={()=>setSection(s)}>{s}</button>)}
    </div>)}

    {tab==="roster"&&<Roster roster={roster} sections={sections} addStudents={addStudents} updStudent={updStudent} delStudent={delStudent} onReport={onReport}/>}

    {tab==="mastery"&&(!state.students.length||!standards.length
      ? <MasteryEmpty hasStudents={!!state.students.length} hasStd={!!standards.length}/>
      : <MasteryGrid students={roster.filter(inSection)} standards={standards} mastery={state.mastery} cycle={cycleLevel}/>)}

    {tab==="snapshot"&&(!state.students.length||!standards.length
      ? <MasteryEmpty hasStudents={!!state.students.length} hasStd={!!standards.length}/>
      : <Snapshot students={roster.filter(inSection)} standards={standards} mastery={state.mastery}/>)}
  </div>);
}

function Roster({roster,sections,addStudents,updStudent,delStudent,onReport}){
  const [name,setName]=useState("");const [sec,setSec]=useState(sections[0]||"Class 1");
  const [lang,setLang]=useState("English");const [flag,setFlag]=useState("none");
  const [bulk,setBulk]=useState("");const [bulkSec,setBulkSec]=useState(sections[0]||"Class 1");const [showBulk,setShowBulk]=useState(false);
  const addOne=()=>{if(!name.trim())return;addStudents([{name:name.trim(),section:sec.trim()||"Class 1",language:lang,flag}]);setName("");};
  const addBulk=()=>{const names=bulk.split("\n").map(t=>t.trim()).filter(Boolean);if(!names.length)return;addStudents(names.map(n=>({name:n,section:bulkSec.trim()||"Class 1",language:"English",flag:"none"})));setBulk("");setShowBulk(false);};
  const grouped=roster.reduce((a,s)=>{(a[s.section||"Unassigned"]=a[s.section||"Unassigned"]||[]).push(s);return a;},{});

  return(<div>
    <div className="card" style={{padding:20,marginBottom:18}}>
      <div className="linkrow" style={{marginBottom:0,flexWrap:"wrap"}}>
        <input className="input" style={{flex:"1 1 200px"}} placeholder="Student name" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addOne();}}/>
        <input className="input" style={{flex:"0 0 130px"}} placeholder="Class" value={sec} onChange={e=>setSec(e.target.value)} list="secs"/>
        <datalist id="secs">{sections.map(s=><option key={s} value={s}/>)}</datalist>
        <select className="select" style={{flex:"0 0 130px"}} value={lang} onChange={e=>setLang(e.target.value)}>{LANGS.map(l=><option key={l}>{l}</option>)}</select>
        <select className="select" style={{flex:"0 0 150px"}} value={flag} onChange={e=>setFlag(e.target.value)}><option value="none">No flag</option><option value="intervention">Intervention</option><option value="enrichment">Enrichment</option></select>
        <button className="btn btn-primary" onClick={addOne}><I d={ic.plus} s={14}/> Add</button>
      </div>
      <button className="add-link" style={{marginTop:12}} onClick={()=>setShowBulk(v=>!v)}>{showBulk?"Hide":"Paste a class list"}</button>
      {showBulk&&<div style={{marginTop:10}}>
        <div className="linkrow"><input className="input" style={{flex:"0 0 160px"}} placeholder="Class" value={bulkSec} onChange={e=>setBulkSec(e.target.value)}/><span style={{flex:1,alignSelf:"center",fontSize:12,color:"var(--muted)"}}>One name per line</span></div>
        <textarea className="textarea" style={{minHeight:110}} value={bulk} onChange={e=>setBulk(e.target.value)} placeholder={"Ana Valencia\nDiego Ramos\nSofía Torres…"}/>
        <button className="btn btn-primary btn-sm" style={{marginTop:8}} onClick={addBulk}>Add all</button>
      </div>}
    </div>

    {roster.length?Object.entries(grouped).map(([g,list])=>(<div key={g} style={{marginBottom:20}}>
      <div className="section-hd"><h3 style={{fontSize:13}}>{g} <span style={{color:"var(--muted)",fontWeight:500}}>· {list.length}</span></h3></div>
      <div className="bank-list">
        {list.map(s=>(<div className="bank-row" key={s.id} style={{cursor:"default",padding:"12px 16px"}}>
          <div className="br-badge" style={{background:"var(--surface-2)",color:"var(--ink-2)",width:38,height:38,flex:"0 0 38px"}}><span className="n" style={{fontSize:14}}>{s.name.split(" ").map(w=>w[0]).slice(0,2).join("")}</span></div>
          <div className="br-main"><div className="br-title" style={{fontSize:14}}>{s.name}</div>
            <div className="br-meta"><span>{s.language}</span>{s.flag!=="none"&&<span className={"pill "+(s.flag==="intervention"?"pill-terra":"pill-olive")} style={{fontSize:10}}>{s.flag}</span>}</div></div>
          <select className="select" style={{width:130,padding:"5px 8px",fontSize:12.5}} value={s.flag} onChange={e=>updStudent(s.id,{flag:e.target.value})}><option value="none">No flag</option><option value="intervention">Intervention</option><option value="enrichment">Enrichment</option></select>
          {onReport&&<button className="btn btn-ghost btn-sm" onClick={()=>onReport(s.id)} title="Open conference report"><I d={ic.file} s={14}/></button>}
          <button className="mini-x" onClick={()=>delStudent(s.id)}><I d={ic.x} s={14}/></button>
        </div>))}
      </div>
    </div>)):<div className="empty"><div className="empty-ic"><I d={ic.users} s={24}/></div><h3>No students yet</h3><p>Add them one at a time, or paste a whole class list above — one name per line. Around 78 students takes under a minute.</p></div>}
  </div>);
}

function MasteryEmpty({hasStudents,hasStd}){
  return(<div className="empty"><div className="empty-ic"><I d={ic.grid} s={24}/></div>
    <h3>{!hasStudents?"Add students first":"Add standards to your lessons"}</h3>
    <p>{!hasStudents?"The mastery grid maps your students against the standards from your lesson bank.":"Mastery tracks the standards attached to your lessons. Add standards on a lesson (e.g. 4.NBT.B.5) and they’ll appear here as columns."}</p></div>);
}

function MasteryGrid({students,standards,mastery,cycle}){
  if(!students.length)return<div className="empty"><div className="empty-ic"><I d={ic.users} s={24}/></div><h3>No students in this class</h3><p>Pick a different class above.</p></div>;
  return(<div>
    <div style={{display:"flex",gap:14,marginBottom:14,flexWrap:"wrap",fontSize:12,color:"var(--muted)",alignItems:"center"}}>
      <span>Tap a cell to cycle:</span>
      {M_LEVELS.slice(1).map(l=><span key={l.v} style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:18,height:18,borderRadius:5,background:l.bg,border:"1px solid "+l.bd,color:l.fg,fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{l.short}</span>{l.label}</span>)}
    </div>
    <div className="card" style={{overflowX:"auto",padding:0}}>
      <table style={{borderCollapse:"collapse",width:"100%",minWidth:standards.length*72+220}}>
        <thead><tr>
          <th style={{position:"sticky",left:0,zIndex:2,background:"var(--surface)",textAlign:"left",padding:"12px 16px",borderBottom:"1px solid var(--border)",fontSize:12,color:"var(--muted)",fontWeight:600,minWidth:200}}>Student</th>
          {standards.map(s=><th key={s} style={{padding:"12px 6px",borderBottom:"1px solid var(--border)",borderLeft:"1px solid var(--border)",fontSize:10.5,fontWeight:600,color:"var(--ink-2)",whiteSpace:"nowrap",minWidth:66}}>{s}</th>)}
        </tr></thead>
        <tbody>
          {students.map((st,ri)=>(<tr key={st.id} style={{background:ri%2?"#FCFAF6":"var(--surface)"}}>
            <td style={{position:"sticky",left:0,zIndex:1,background:ri%2?"#FCFAF6":"var(--surface)",padding:"9px 16px",fontSize:13,fontWeight:550,borderBottom:"1px solid var(--border)"}}>{st.name}
              {st.flag!=="none"&&<span style={{width:7,height:7,borderRadius:2,display:"inline-block",marginLeft:7,background:st.flag==="intervention"?"var(--terra)":"var(--olive)"}}/>}</td>
            {standards.map(std=>{const lv=(mastery[st.id]||{})[std]||0;const m=M_LEVELS[lv];
              return(<td key={std} style={{borderLeft:"1px solid var(--border)",borderBottom:"1px solid var(--border)",padding:4,textAlign:"center"}}>
                <button onClick={()=>cycle(st.id,std)} title={m.label} style={{width:"100%",minWidth:56,height:34,borderRadius:8,background:m.bg,border:"1px solid "+m.bd,color:m.fg,fontWeight:700,fontSize:11.5,transition:"all .12s"}}>{m.short}</button>
              </td>);})}
          </tr>))}
        </tbody>
      </table>
    </div>
  </div>);
}

function Snapshot({students,standards,mastery}){
  if(!students.length)return<div className="empty"><div className="empty-ic"><I d={ic.users} s={24}/></div><h3>No students in this class</h3><p>Pick a different class above.</p></div>;
  const rows=standards.map(std=>{
    const counts=[0,0,0,0,0];let assessed=0;
    students.forEach(st=>{const lv=(mastery[st.id]||{})[std]||0;counts[lv]++;if(lv>0)assessed++;});
    const meetsPlus=counts[3]+counts[4];
    const pct=assessed?Math.round(meetsPlus/assessed*100):0;
    return{std,counts,assessed,meetsPlus,pct};
  }).sort((a,b)=>(a.assessed?a.pct:101)-(b.assessed?b.pct:101));
  return(<div style={{display:"flex",flexDirection:"column",gap:10}}>
    <div style={{fontSize:12,color:"var(--muted)",marginBottom:2}}>Sorted by class need — lowest mastery first. Percentage = share of assessed students at Meets or Exceeds.</div>
    {rows.map(r=>(<div className="card" key={r.std} style={{padding:"14px 18px",display:"flex",alignItems:"center",gap:16}}>
      <div style={{minWidth:120}}><div style={{fontWeight:600,fontSize:13}}>{r.std}</div><div style={{fontSize:11.5,color:"var(--muted)"}}>{r.assessed}/{students.length} assessed</div></div>
      <div style={{flex:1,display:"flex",height:20,borderRadius:6,overflow:"hidden",border:"1px solid var(--border)"}}>
        {r.assessed?M_LEVELS.slice(1).map(l=>{const c=r.counts[l.v];if(!c)return null;return<div key={l.v} title={l.label+": "+c} style={{width:(c/r.assessed*100)+"%",background:l.v>=3?(l.v===4?"var(--olive-deep)":"var(--olive)"):(l.v===1?"var(--terra)":"#CBA968")}}/>;})
          :<div style={{width:"100%",background:"var(--surface-2)"}}/>}
      </div>
      <div style={{minWidth:52,textAlign:"right",fontWeight:700,fontSize:15,color:r.assessed?(r.pct>=70?"var(--olive-deep)":r.pct>=40?"#8B6A3C":"var(--terra-deep)"):"var(--muted-2)"}}>{r.assessed?r.pct+"%":"—"}</div>
    </div>))}
  </div>);
}

function normStd(code){return String(code).toLowerCase().replace(/\s+/g,"").replace(/\.([a-c])\.(\d)/,".$2");}

function DataDashboard({state,onOpen}){
  const [section,setSection]=useState("All");
  const [open,setOpen]=useState({});
  const sections=useMemo(()=>[...new Set(state.students.map(s=>s.section).filter(Boolean))].sort(),[state.students]);
  const students=state.students.filter(s=>section==="All"||s.section===section);

  const coverOf=useCallback(norm=>state.lessons.filter(l=>(l.standards||[]).some(c=>{const n=normStd(c);return n===norm||n.startsWith(norm+".");})),[state.lessons]);
  const masteryOf=useCallback(norm=>{let a=0,m=0;students.forEach(st=>{const rec=state.mastery[st.id]||{};Object.keys(rec).forEach(k=>{const n=normStd(k);if((n===norm||n.startsWith(norm+"."))&&rec[k]>0){a++;if(rec[k]>=3)m++;}});});return{assessed:a,pct:a?Math.round(m/a*100):null};},[students,state.mastery]);

  const ALL=useMemo(()=>CCSS_G4_MATH.flatMap(d=>d.standards.map(s=>({...s,norm:normStd(s.code)}))),[]);
  const covered=ALL.filter(s=>coverOf(s.norm).length>0).length;
  const gaps=ALL.length-covered;
  let sumPct=0,cnt=0;ALL.forEach(s=>{const mm=masteryOf(s.norm);if(mm.pct!==null){sumPct+=mm.pct;cnt++;}});
  const avgMastery=cnt?Math.round(sumPct/cnt):null;

  const ccssNorms=ALL.map(s=>s.norm);
  const unmatched=[...new Set(state.lessons.flatMap(l=>l.standards||[]))].filter(c=>{const n=normStd(c);return !ccssNorms.some(cn=>cn===n||n.startsWith(cn+".")||cn.startsWith(n+"."));});

  const barColor=p=>p>=70?"var(--olive)":p>=40?"#CBA968":"var(--terra)";
  const tiles=[
    {n:covered+"/"+ALL.length,l:"standards covered by a lesson"},
    {n:gaps,l:gaps===1?"coverage gap":"coverage gaps",warn:gaps>0},
    {n:avgMastery===null?"—":avgMastery+"%",l:"avg class mastery (Meets+)"},
    {n:students.length,l:section==="All"?"students tracked":"students in "+section},
  ];

  return(<div className="content">
    <div style={{marginBottom:18}}>
      <h1 style={{fontSize:22}}>Data dashboard</h1>
      <div className="greet-sub" style={{margin:"3px 0 0"}}>Grade 4 Math · Common Core · {ALL.length} standards</div>
    </div>

    {sections.length>0&&<div className="filters" style={{marginBottom:18}}>
      <button className={"fchip"+(section==="All"?" on":"")} onClick={()=>setSection("All")}>All classes</button>
      {sections.map(s=><button key={s} className={"fchip"+(section===s?" on":"")} onClick={()=>setSection(s)}>{s}</button>)}
    </div>}

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:14,marginBottom:22}}>
      {tiles.map((t,i)=>(<div className="card" key={i} style={{padding:"18px 20px"}}>
        <div style={{fontSize:26,fontWeight:650,letterSpacing:"-.02em",color:t.warn?"var(--terra-deep)":"var(--ink)"}}>{t.n}</div>
        <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>{t.l}</div>
      </div>))}
    </div>

    {CCSS_G4_MATH.map(dom=>{
      const stds=dom.standards.map(s=>({...s,norm:normStd(s.code)}));
      const domCov=stds.filter(s=>coverOf(s.norm).length>0).length;
      let dp=0,dc=0;stds.forEach(s=>{const mm=masteryOf(s.norm);if(mm.pct!==null){dp+=mm.pct;dc++;}});
      const domM=dc?Math.round(dp/dc):null;
      return(<div className="card" key={dom.domain} style={{padding:0,marginBottom:16,overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",gap:14,padding:"14px 20px",borderBottom:"1px solid var(--border)",background:"var(--surface-2)",flexWrap:"wrap"}}>
          <span className="pill pill-olive" style={{fontSize:12}}>{dom.domain}</span>
          <div style={{fontWeight:600,fontSize:14}}>{dom.name}</div>
          <div style={{marginLeft:"auto",display:"flex",gap:18,fontSize:12,color:"var(--muted)"}}>
            <span><b style={{color:domCov===stds.length?"var(--olive-deep)":"var(--terra-deep)",fontWeight:700}}>{domCov}/{stds.length}</b> covered</span>
            <span>mastery <b style={{color:"var(--ink)",fontWeight:700}}>{domM===null?"—":domM+"%"}</b></span>
          </div>
        </div>
        <div>
          {stds.map(s=>{
            const cv=coverOf(s.norm);const mm=masteryOf(s.norm);const isOpen=open[s.code];
            return(<div key={s.code} style={{borderBottom:"1px solid var(--border)"}}>
              <div style={{display:"flex",alignItems:"center",gap:12,padding:"12px 20px",cursor:cv.length?"pointer":"default"}} onClick={()=>cv.length&&setOpen(o=>({...o,[s.code]:!o[s.code]}))}>
                <span style={{fontFamily:"ui-monospace,SFMono-Regular,monospace",fontSize:12,fontWeight:600,color:"var(--ink-2)",minWidth:76}}>{s.code}</span>
                <span style={{flex:1,fontSize:13,color:"var(--ink-2)",minWidth:120}}>{s.desc}</span>
                {cv.length?<span className="pill pill-gray" style={{fontSize:10.5}}>{cv.length} lesson{cv.length>1?"s":""}</span>:<span className="pill pill-terra" style={{fontSize:10.5}}>Gap</span>}
                <div style={{width:112,display:"flex",alignItems:"center",gap:8}}>
                  <div style={{flex:1,height:7,borderRadius:99,background:"var(--surface-2)",overflow:"hidden"}}>
                    {mm.pct!==null&&<div style={{height:"100%",width:mm.pct+"%",background:barColor(mm.pct),borderRadius:99}}/>}
                  </div>
                  <span style={{fontSize:11.5,fontWeight:700,color:"var(--muted)",minWidth:30,textAlign:"right"}}>{mm.pct===null?"—":mm.pct+"%"}</span>
                </div>
              </div>
              {isOpen&&cv.length>0&&<div style={{padding:"0 20px 12px 108px",display:"flex",flexWrap:"wrap",gap:8}}>
                {cv.map(l=><button key={l.id} className="pill pill-olive" style={{cursor:"pointer"}} onClick={e=>{e.stopPropagation();onOpen(l.id);}}>{l.subject[0]} · {l.title}</button>)}
              </div>}
            </div>);
          })}
        </div>
      </div>);
    })}

    {unmatched.length>0&&<div className="card" style={{padding:"16px 20px"}}>
      <div className="p-sec-t" style={{marginBottom:8}}>Tagged standards outside Grade 4 math</div>
      <div className="chips">{unmatched.map((c,i)=><span key={i} className="pill pill-gray">{c}</span>)}</div>
      <div style={{fontSize:11.5,color:"var(--muted)",marginTop:8}}>On your lessons but not a Grade 4 math CCSS code — likely science, ELA, or another grade. Still tracked in the mastery grid.</div>
    </div>}
  </div>);
}

          <div style={{borderTop:"1px solid var(--border)",paddingTop:18,marginTop:6}}>
