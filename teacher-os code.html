/* ============================================================
   12e. SMALL GROUPS  (auto-sort by a weak standard)
============================================================ */
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return h>>>0;}
const BAND=[
  {lv:1,name:"Intensive support",sub:"Not yet"},
  {lv:2,name:"Targeted reteach",sub:"Approaching"},
  {lv:3,name:"On-level practice",sub:"Meets"},
  {lv:4,name:"Enrichment & extension",sub:"Exceeds"},
];
function GroupsView({state}){
  const [section,setSection]=useState("All");
  const [norm,setNorm]=useState(null);
  const [mode,setMode]=useState("level");
  const [size,setSize]=useState(4);
  const [pool,setPool]=useState({1:true,2:true,3:false,4:false});
  const [seed,setSeed]=useState(1);
  const sections=useMemo(()=>[...new Set(state.students.map(s=>s.section).filter(Boolean))].sort(),[state.students]);
  const students=state.students.filter(s=>section==="All"||s.section===section);

  const normMeta=useMemo(()=>{const m={};CCSS_G4_MATH.forEach(d=>d.standards.forEach(s=>{m[normStd(s.code)]={code:s.code,desc:s.desc};}));return m;},[]);
  const lvl=(st,nrm)=>{const rec=state.mastery[st.id]||{};let mx=0;Object.keys(rec).forEach(k=>{const n=normStd(k);if((n===nrm||n.startsWith(nrm+".")||nrm.startsWith(n+"."))&&rec[k]>mx)mx=rec[k];});return mx;};

  const candidates=useMemo(()=>{
    const canon=new Set();
    students.forEach(st=>{const rec=state.mastery[st.id]||{};Object.keys(rec).forEach(k=>{if(rec[k]>0){let n=normStd(k);let c=n;Object.keys(normMeta).forEach(cn=>{if(cn===n||n.startsWith(cn+".")||cn.startsWith(n+"."))c=cn;});canon.add(c);}});});
    return [...canon].map(nrm=>{let a=0,m=0;students.forEach(st=>{const L=lvl(st,nrm);if(L>0){a++;if(L>=3)m++;}});
      return{norm:nrm,code:normMeta[nrm]?normMeta[nrm].code:nrm.toUpperCase(),desc:normMeta[nrm]?normMeta[nrm].desc:"",assessed:a,meets:m,pct:a?Math.round(m/a*100):0};})
      .sort((x,y)=>x.pct-y.pct||y.assessed-x.assessed);
  },[students,state.mastery,normMeta]);

  const cur=candidates.find(c=>c.norm===norm)||candidates[0];

  if(!state.students.length)return(<div className="content"><div className="empty"><div className="empty-ic"><I d={ic.groups} s={24}/></div><h3>No students yet</h3><p>Add your class in Students &amp; mastery to build groups.</p></div></div>);
  if(!candidates.length)return(<div className="content"><div className="empty"><div className="empty-ic"><I d={ic.grid} s={24}/></div><h3>No mastery recorded yet</h3><p>Fill in the mastery grid for at least one standard, and this will sort your students into groups automatically.</p></div></div>);

  const buckets={1:[],2:[],3:[],4:[],0:[]};
  students.forEach(st=>buckets[lvl(st,cur.norm)].push(st));
  const chunk=(arr,n)=>{const o=[];for(let i=0;i<arr.length;i+=n)o.push(arr.slice(i,i+n));return o;};
  const poolLevels=[1,2,3,4].filter(l=>pool[l]);
  const poolStudents=students.filter(st=>poolLevels.includes(lvl(st,cur.norm)))
    .sort((a,b)=>lvl(a,cur.norm)-lvl(b,cur.norm)||(hashStr(a.id+"_"+seed)-hashStr(b.id+"_"+seed)));
  const smallGroups=chunk(poolStudents,size);

  const Chip=({s})=><span className="pill pill-gray" style={{fontSize:11.5}}>{s.name}{sections.length>1?<span style={{color:"var(--muted-2)",marginLeft:5}}>{s.section}</span>:null}</span>;

  return(<div className="content">
    <div className="no-print">
      <div style={{marginBottom:16}}><h1 style={{fontSize:22}}>Small groups</h1>
        <div className="greet-sub" style={{margin:"3px 0 0"}}>Grouped from live mastery data — standards are ranked by class need, weakest first.</div></div>

      {sections.length>0&&<div className="filters" style={{marginBottom:14}}>
        <button className={"fchip"+(section==="All"?" on":"")} onClick={()=>setSection("All")}>All classes</button>
        {sections.map(s=><button key={s} className={"fchip"+(section===s?" on":"")} onClick={()=>setSection(s)}>{s}</button>)}
      </div>}

      <div className="card" style={{padding:18,marginBottom:18}}>
        <div className="grid2" style={{marginBottom:4}}>
          <Field label="Standard (weakest first)"><select className="select" value={cur.norm} onChange={e=>setNorm(e.target.value)}>
            {candidates.map(c=><option key={c.norm} value={c.norm}>{c.code} — {c.pct}% Meets+ ({c.assessed} assessed)</option>)}</select>
            {cur.desc&&<div className="hint">{cur.desc}</div>}</Field>
          <Field label="Group by"><div style={{display:"flex",gap:6}}>
            <button className={"btn btn-sm"+(mode==="level"?" btn-primary":"")} style={{flex:1}} onClick={()=>setMode("level")}>Mastery band</button>
            <button className={"btn btn-sm"+(mode==="small"?" btn-primary":"")} style={{flex:1}} onClick={()=>setMode("small")}>Small groups</button>
          </div></Field>
        </div>
        {mode==="small"&&<div style={{display:"flex",gap:18,alignItems:"center",flexWrap:"wrap",marginTop:6,paddingTop:14,borderTop:"1px solid var(--border)"}}>
          <div><label className="fl">Include</label><div style={{display:"flex",gap:6}}>
            {BAND.map(b=><button key={b.lv} className={"fchip"+(pool[b.lv]?" on":"")} onClick={()=>setPool(p=>({...p,[b.lv]:!p[b.lv]}))}>{b.sub}</button>)}</div></div>
          <div><label className="fl">Group size</label><div style={{display:"flex",alignItems:"center",gap:6}}>
            <button className="icon-btn" onClick={()=>setSize(s=>Math.max(2,s-1))}>–</button>
            <span style={{minWidth:22,textAlign:"center",fontWeight:600}}>{size}</span>
            <button className="icon-btn" onClick={()=>setSize(s=>Math.min(8,s+1))}>+</button></div></div>
          <button className="btn btn-sm" style={{marginTop:18}} onClick={()=>setSeed(s=>s+1)}><I d={ic.undo} s={14}/> Reshuffle</button>
        </div>}
      </div>

      <div style={{display:"flex",gap:10,marginBottom:16,alignItems:"center"}}>
        <div style={{fontSize:13,color:"var(--muted)"}}>{mode==="level"?"Four bands for ":`${poolStudents.length} students → ${smallGroups.length} group${smallGroups.length===1?"":"s"} on `}<b style={{color:"var(--ink-2)"}}>{cur.code}</b></div>
        <button className="btn btn-primary btn-sm" style={{marginLeft:"auto"}} onClick={()=>window.print()}><I d={ic.file} s={14}/> Print groups</button>
      </div>
    </div>

    <div className="report-doc">
      <div className="print-only" style={{marginBottom:16,borderBottom:"2px solid var(--olive)",paddingBottom:12}}>
        <div className="serif" style={{fontSize:20,fontWeight:600}}>Small groups · {cur.code}</div>
        <div style={{fontSize:12,color:"var(--muted)"}}>{cur.desc} · {section==="All"?"All classes":section} · {prettyLong(todayISO())}</div>
      </div>

      {mode==="level"?(
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))",gap:14}}>
          {BAND.map(b=>{const list=buckets[b.lv];const m=M_LEVELS[b.lv];
            return(<div className="card" key={b.lv} style={{padding:0,overflow:"hidden"}}>
              <div style={{padding:"12px 16px",background:m.bg,borderBottom:"1px solid "+m.bd,display:"flex",alignItems:"center",gap:8}}>
                <LvBadge lv={b.lv}/><div><div style={{fontWeight:600,fontSize:13,color:m.fg==="#fff"?"var(--ink)":m.fg}}>{b.name}</div><div style={{fontSize:11,color:"var(--muted)"}}>{b.sub} · {list.length}</div></div></div>
              <div style={{padding:14,display:"flex",flexWrap:"wrap",gap:7}}>
                {list.length?list.map(s=><Chip key={s.id} s={s}/>):<span style={{fontSize:12,color:"var(--muted-2)"}}>None</span>}</div>
            </div>);})}
          {buckets[0].length>0&&<div className="card" style={{padding:0,overflow:"hidden"}}>
            <div style={{padding:"12px 16px",background:"var(--surface-2)",borderBottom:"1px solid var(--border)"}}><div style={{fontWeight:600,fontSize:13}}>Not yet assessed</div><div style={{fontSize:11,color:"var(--muted)"}}>{buckets[0].length}</div></div>
            <div style={{padding:14,display:"flex",flexWrap:"wrap",gap:7}}>{buckets[0].map(s=><Chip key={s.id} s={s}/>)}</div></div>}
        </div>
      ):(
        poolStudents.length?(<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(220px,1fr))",gap:14}}>
          {smallGroups.map((g,i)=>(<div className="card" key={i} style={{padding:0,overflow:"hidden"}}>
            <div style={{padding:"12px 16px",background:"var(--olive-soft)",borderBottom:"1px solid var(--olive)",display:"flex",alignItems:"center",gap:8}}>
              <span className="pill pill-olive" style={{fontSize:11}}>Group {i+1}</span><span style={{fontSize:11.5,color:"var(--olive-deep)"}}>{g.length} students</span></div>
            <div style={{padding:14,display:"flex",flexDirection:"column",gap:8}}>
              {g.map(s=><div key={s.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:13}}><LvBadge lv={lvl(s,cur.norm)}/><span style={{fontWeight:550}}>{s.name}</span>{sections.length>1&&<span style={{fontSize:11,color:"var(--muted)",marginLeft:"auto"}}>{s.section}</span>}</div>)}</div>
          </div>))}
        </div>):<div className="empty"><div className="empty-ic"><I d={ic.groups} s={24}/></div><h3>No students in that band</h3><p className="no-print">Pick different mastery levels to include above.</p></div>
      )}
    </div>
  </div>);
}

/* ============================================================
   12f. AUTH GATE  (only active when Firebase is configured)
============================================================ */
function Loading(){
  return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--muted)",fontSize:14}}>Loading Teacher OS…</div>);
}
function SignIn(){
  const [email,setEmail]=useState("");const [pw,setPw]=useState("");
  const [err,setErr]=useState("");const [busy,setBusy]=useState(false);
  const submit=()=>{if(!email||!pw)return;setBusy(true);setErr("");
    fbAuth.signInWithEmailAndPassword(email.trim(),pw).catch(e=>{
      const map={"auth/invalid-credential":"Email or password is incorrect.","auth/wrong-password":"Email or password is incorrect.","auth/user-not-found":"No account with that email.","auth/invalid-email":"That doesn’t look like an email address.","auth/too-many-requests":"Too many attempts — wait a minute and try again."};
      setErr(map[e.code]||"Couldn’t sign in. Check your connection and try again.");setBusy(false);});};
  return(<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)",padding:20}}>
    <div className="card" style={{width:"min(380px,100%)",padding:"32px 30px"}}>
      <div className="brand" style={{padding:"0 0 18px"}}><div className="brand-mark">N</div><div><div className="brand-name">Teacher OS</div><div className="brand-sub">Mrs. Nava · Grade 4</div></div></div>
      <h2 style={{fontSize:18,marginBottom:4}}>Sign in</h2>
      <p style={{fontSize:12.5,color:"var(--muted)",marginTop:0,marginBottom:18}}>Your students’ data is protected — sign in to open your planner.</p>
      <label className="fl">Email</label>
      <input className="input" style={{marginBottom:14}} type="email" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")submit();}} autoFocus/>
      <label className="fl">Password</label>
      <input className="input" type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")submit();}}/>
      {err&&<div style={{color:"var(--terra-deep)",fontSize:12.5,marginTop:12}}>{err}</div>}
      <button className="btn btn-primary" style={{width:"100%",justifyContent:"center",marginTop:18,opacity:busy?.6:1}} disabled={busy} onClick={submit}>{busy?"Signing in…":"Sign in"}</button>
      {CONFIG_FROM_STORAGE&&<button className="btn-ghost btn-sm" style={{width:"100%",justifyContent:"center",marginTop:10,color:"var(--muted)",fontSize:11.5}} onClick={()=>{localStorage.removeItem("teacher-os-fbconfig");location.reload();}}>Disconnect this device / use a different project</button>}
    </div>
  </div>);
}
function ConnectSync({onClose}){
  const [text,setText]=useState("");const [err,setErr]=useState("");
  const connect=()=>{try{const cfg=parseConfig(text);localStorage.setItem("teacher-os-fbconfig",JSON.stringify(cfg));location.reload();}catch(e){setErr(e.message);}};
  return(<div className="modal-wrap" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal" style={{maxWidth:520}}>
      <div className="modal-head"><div><div className="eyebrow" style={{marginBottom:2}}>Sync</div><h2 style={{fontSize:18}}>Connect sync across devices</h2></div>
        <button className="panel-close" style={{position:"static"}} onClick={onClose}><I d={ic.x}/></button></div>
      <div className="modal-body">
        <p style={{fontSize:13,color:"var(--ink-2)",marginTop:0,lineHeight:1.6}}>In Firebase → <b>Project settings → Your apps → SDK setup and configuration</b>, copy the config and paste it below. It’s saved on this device, then you’ll sign in. Do this once on each computer.</p>
        <textarea className="textarea" style={{minHeight:150,fontFamily:"ui-monospace,monospace",fontSize:12.5}} value={text} onChange={e=>setText(e.target.value)} placeholder={'{\n  apiKey: "…",\n  authDomain: "nava-dashboard-4f966.firebaseapp.com",\n  projectId: "nava-dashboard-4f966",\n  …\n}'}/>
        {err&&<div style={{color:"var(--terra-deep)",fontSize:12.5,marginTop:10}}>{err}</div>}
      </div>
      <div className="modal-foot"><button className="btn" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={connect}>Connect &amp; reload</button></div>
    </div>
  </div>);
}

/* ============================================================
   13. APP
============================================================ */
function App(){
  const [state,setStateRaw]=useState(()=>loadLocal()||EMPTY_STATE);
  const [view,setView]=useState("dashboard");
  const [panel,setPanel]=useState(null);      // {lessonId, date}
  const [editing,setEditing]=useState(null);   // lesson obj or {} for new
  const [toastMsg,setToastMsg]=useState(null);
  const [reportStudent,setReportStudent]=useState(null);
  const [authUser,setAuthUser]=useState(CLOUD?null:"local"); // null=checking · "local"=no cloud · false=signed out · obj=signed in
  const [showConnect,setShowConnect]=useState(false);
  const [mobileNav,setMobileNav]=useState(false);
  const skipSave=useRef(false);

  const setState=useCallback(updater=>{setStateRaw(prev=>typeof updater==="function"?updater(prev):updater);},[]);

  // Auth (only when Firebase is configured; otherwise stays in local mode)
  useEffect(()=>{
    if(!CLOUD)return;
    if(!initFirebase()){setAuthUser("local");return;} // SDK blocked → degrade to local
    const un=fbAuth.onAuthStateChanged(u=>setAuthUser(u||false));
    return()=>un&&un();
  },[]);

  const synced=fbEnabled&&authUser&&authUser!=="local"&&authUser!==false;

  // Pull + live-sync from Firestore once signed in
  useEffect(()=>{
    if(!synced)return;
    fbDoc.get().then(snap=>{if(snap.exists){skipSave.current=true;setStateRaw({...EMPTY_STATE,...snap.data()});}}).catch(()=>{});
    const unsub=fbDoc.onSnapshot(snap=>{if(snap.exists&&snap.metadata.hasPendingWrites===false){skipSave.current=true;setStateRaw({...EMPTY_STATE,...snap.data()});}},()=>{});
    return()=>unsub&&unsub();
  },[synced]);

  // persist (debounced): always local; cloud only when signed in
  useEffect(()=>{
    if(skipSave.current){skipSave.current=false;return;}
    saveLocal(state);
    if(synced){const id=setTimeout(()=>{fbDoc.set(state).catch(()=>{});},600);return()=>clearTimeout(id);}
  },[state]);

  const sched=useMemo(()=>computeSchedule(state),[state]);

  const toast={
    show:(msg,action,fn)=>{setToastMsg({msg,action,fn});setTimeout(()=>setToastMsg(t=>t&&t.msg===msg?null:t),5000);},
    go:setView,
  };
  const openLesson=(id,date)=>setPanel({lessonId:id,date});
  const panelLesson=panel?state.lessons.find(l=>l.id===panel.lessonId):null;

  const saveLesson=f=>{
    setState(p=>{
      const exists=p.lessons.some(l=>l.id===f.id);
      const lessons=exists?p.lessons.map(l=>l.id===f.id?f:l):[...p.lessons,{...f,id:uid()}];
      return{...p,lessons};
    });
    setEditing(null);
    toast.show(f.id?"Lesson saved":"Lesson added to bank");
  };
  const deleteLesson=id=>{
    setState(p=>{const pins={...p.pins};SUBJECTS.forEach(s=>{if(pins[s]){pins[s]={...pins[s]};Object.keys(pins[s]).forEach(d=>{if(pins[s][d]===id)delete pins[s][d];});}});
      return{...p,lessons:p.lessons.filter(l=>l.id!==id),pins};});
    setEditing(null);setPanel(null);toast.show("Lesson deleted");
  };
  const togglePrep=(lid,i)=>setState(p=>{const prep={...p.prep,[lid]:{...(p.prep[lid]||{})}};prep[lid][i]=!prep[lid][i];return{...p,prep};});

  const NAV=[
    {k:"dashboard",label:"Dashboard",icon:ic.home,group:"Plan"},
    {k:"planner",label:"Monthly planner",icon:ic.cal,group:"Plan"},
    {k:"bank",label:"Lesson bank",icon:ic.bank,group:"Plan"},
    {k:"students",label:"Students & mastery",icon:ic.users,group:"Track"},
    {k:"groups",label:"Small groups",icon:ic.groups,group:"Track"},
    {k:"data",label:"Data dashboard",icon:ic.chart,group:"Track"},
    {k:"reports",label:"Conference reports",icon:ic.file,group:"Track"},
    {k:"year",label:"School year",icon:ic.gear,group:"Setup"},
  ];
  const GROUPS=["Plan","Track","Setup"];
  const TITLES={dashboard:"Dashboard",planner:"Monthly planner",bank:"Lesson bank",students:"Students & mastery",groups:"Small groups",data:"Data dashboard",reports:"Conference reports",year:"School year"};

  if(CLOUD&&authUser===null)return <Loading/>;
  if(CLOUD&&authUser===false)return <SignIn/>;

  return(<div className="app">
    <aside className={"sidebar"+(mobileNav?" open":"")}>
      <div className="brand"><div className="brand-mark">N</div><div><div className="brand-name">Teacher OS</div><div className="brand-sub">Mrs. Nava · Grade 4</div></div></div>
      {GROUPS.map(g=>(<React.Fragment key={g}>
        <div className="nav-label">{g}</div>
        {NAV.filter(n=>n.group===g).map(n=><button key={n.k} className={"nav-item"+(view===n.k?" active":"")} onClick={()=>{setView(n.k);setMobileNav(false);}}><I d={n.icon}/>{n.label}</button>)}
      </React.Fragment>))}
      <div className="sidebar-foot">
        <div><span className="sync-dot" style={{background:synced?"var(--olive)":"var(--muted-2)"}}/>{synced?"Synced across devices":"Saved on this device"}</div>
        {synced&&<button className="btn-ghost btn-sm" style={{marginTop:8,padding:"4px 0",color:"var(--muted)",fontSize:11.5}} onClick={()=>fbAuth.signOut()}>Sign out</button>}
        {!CLOUD&&<button className="btn-ghost btn-sm" style={{marginTop:8,padding:"4px 0",color:"var(--olive-deep)",fontSize:11.5,fontWeight:600}} onClick={()=>setShowConnect(true)}>Connect sync across devices</button>}
      </div>
    </aside>
    {mobileNav&&<div className="nav-backdrop" onClick={()=>setMobileNav(false)}/>}

    <main className="main">
      <div className="topbar">
        <button className="menu-btn icon-btn" onClick={()=>setMobileNav(true)}><I d={ic.menu}/></button>
        <span className="ttl">{TITLES[view]}</span>
        {state.schoolYear.name&&<span className="pill pill-gray">{state.schoolYear.name}</span>}
        <div className="spacer"/>
        <button className="btn btn-primary btn-sm" onClick={()=>setEditing({})}><I d={ic.plus} s={14}/> New lesson</button>
      </div>

      {view==="dashboard"&&<Dashboard state={state} sched={sched} onOpen={openLesson} go={setView}/>}
      {view==="planner"&&<Planner state={state} sched={sched} setState={setState} onOpen={openLesson} toast={toast}/>}
      {view==="bank"&&<Bank state={state} sched={sched} setState={setState} onOpen={openLesson} openNew={()=>setEditing({})} toast={toast}/>}
      {view==="students"&&<StudentsView state={state} setState={setState} toast={toast} onReport={id=>{setReportStudent(id);setView("reports");}}/>}
      {view==="groups"&&<GroupsView state={state}/>}
      {view==="data"&&<DataDashboard state={state} onOpen={openLesson}/>}
      {view==="reports"&&<ReportsView state={state} setState={setState} initialStudent={reportStudent}/>}
      {view==="year"&&<SchoolYear state={state} setState={setState} toast={toast}/>}
    </main>

    {panelLesson&&<LessonPanel lesson={panelLesson} dateInfo={panel.date?prettyLong(panel.date):null} prep={state.prep[panelLesson.id]} onPrep={togglePrep} onClose={()=>setPanel(null)} onEdit={()=>{setEditing(panelLesson);setPanel(null);}}/>}
    {editing&&<LessonForm initial={editing} onSave={saveLesson} onClose={()=>setEditing(null)} onDelete={deleteLesson}/>}
    {showConnect&&<ConnectSync onClose={()=>setShowConnect(false)}/>}

    {toastMsg&&<div className="toast">{toastMsg.msg}{toastMsg.action&&<button onClick={()=>{toastMsg.fn&&toastMsg.fn();setToastMsg(null);}}>{toastMsg.action}</button>}</div>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
